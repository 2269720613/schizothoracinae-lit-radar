", "Löytynoja A"], "journal": "Molecular biology and evolution", "date": "2024-02-01", "doi": "10.1093/molbev/msae031", "url": "https://pubmed.ncbi.nlm.nih.gov/38366566/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S57552105", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/bib/bbae106", "title": "polyGBLUP: a modified genomic best linear unbiased prediction improved the genomic prediction efficiency for autopolyploid species.", "authors": ["Song H", "Zhang Q", "Hu H"], "journal": "Briefings in bioinformatics", "date": "2024-01-22", "doi": "10.1093/bib/bbae106", "url": "https://pubmed.ncbi.nlm.nih.gov/38517695/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S91767247"}, {"id": "10.1186/s13059-023-03160-z", "title": "Haplotype-resolved assembly of a tetraploid potato genome using long reads and low-depth offspring data.", "authors": ["Serra Mari R", "Schrinner S", "Finkers R", "Ziegler FMR", "Arens P", "Schmidt MH", "Usadel B", "Klau GW", "Marschall T"], "journal": "Genome biology", "date": "2024-01-19", "doi": "10.1186/s13059-023-03160-z", "url": "https://pubmed.ncbi.nlm.nih.gov/38243222/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S81160022"}, {"id": "10.7554/elife.88398.3", "title": "Separating phases of allopolyploid evolution with resynthesized and natural Capsella bursa-pastoris", "authors": ["Tianlin Duan", "Adrien Sicard", "Sylvain Glémin", "Martin Lascoux"], "journal": "eLife", "date": "2024-01-08", "doi": "10.7554/elife.88398.3", "url": "https://openalex.org/W4390689371", "abstract": "Allopolyploidization is a frequent evolutionary transition in plants that combines whole-genome duplication (WGD) and interspecific hybridization. The genome of an allopolyploid species results from initial interactions between parental genomes and long-term evolution. Distinguishing the contributions of these two phases is essential to understanding the evolutionary trajectory of allopolyploid species. Here, we compared phenotypic and transcriptomic changes in natural and resynthesized Capsella allotetraploids with their diploid parental species. We focused on phenotypic traits associated with the selfing syndrome and on transcription-level phenomena such as expression-level dominance (ELD), transgressive expression (TRE), and homoeolog expression bias (HEB). We found that selfing syndrome, high pollen, and seed quality in natural allotetraploids likely resulted from long-term evolution. Similarly, TRE and most down-regulated ELD were only found in natural allopolyploids. Natural allotetraploids also had more ELD toward the self-fertilizing parental species than resynthesized allotetraploids, mirroring the establishment of the selfing syndrome. However, short-term changes mattered, and 40% of the cases of ELD in natural allotetraploids were already observed in resynthesized allotetraploids. Resynthesized allotetraploids showed striking variation of HEB among chromosomes and individuals. Homoeologous synapsis was its primary source and may still be a source of genetic variation in natural allotetraploids. In conclusion, both short- and long-term mechanisms contributed to transcriptomic and phenotypic changes in natural allotetraploids. However, the initial gene expression changes were largely reshaped during long-term evolution leading to further morphological changes.", "track": "B", "source": "OpenAlex", "openalex_source_id": "S1336409049", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.ympev.2023.107962", "title": "Phylogenomics and divergence pattern of Polygonatum (Asparagaceae: Polygonateae) in the north temperate region.", "authors": ["Qin YQ", "Zhang MH", "Yang CY", "Nie ZL", "Wen J", "Meng Y"], "journal": "Molecular phylogenetics and evolution", "date": "2024-01-01", "doi": "10.1016/j.ympev.2023.107962", "url": "https://pubmed.ncbi.nlm.nih.gov/37926394/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S96989847"}, {"id": "10.1016/j.molp.2023.10.015", "title": "Genome resources for the elite bread wheat cultivar Aikang 58 and mining of elite homeologous haplotypes for accelerating wheat improvement.", "authors": ["Jia J", "Zhao G", "Li D", "Wang K", "Kong C", "Deng P", "Yan X", "Zhang X", "Lu Z", "Xu S", "Jiao Y", "Chong K", "Liu X", "Cui D", "Li G", "Zhang Y", "Du C", "Wu L", "Li T", "Yan D", "Zhan K", "Chen F", "Wang Z", "Zhang L", "Kong X", "Ru Z", "Wang D", "Gao L"], "journal": "Molecular plant", "date": "2023-12-04", "doi": "10.1016/j.molp.2023.10.015", "url": "https://pubmed.ncbi.nlm.nih.gov/37897037/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S150334665"}, {"id": "10.1093/bib/bbad513", "title": "Subgenome phasing for complex allopolyploidy: case-based benchmarking and recommendations.", "authors": ["Zhang RG", "Shang HY", "Jia KH", "Ma YP"], "journal": "Briefings in bioinformatics", "date": "2023-11-22", "doi": "10.1093/bib/bbad513", "url": "https://pubmed.ncbi.nlm.nih.gov/38189536/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S91767247"}, {"id": "10.1016/j.ympev.2023.107892", "title": "Interspecific gene flow obscures phylogenetic relationships in an important insect pest species complex.", "authors": ["San Jose M", "Doorenweerd C", "Geib S", "Barr N", "Dupuis JR", "Leblanc L", "Kauwe A", "Morris KY", "Rubinoff D"], "journal": "Molecular phylogenetics and evolution", "date": "2023-11-01", "doi": "10.1016/j.ympev.2023.107892", "url": "https://pubmed.ncbi.nlm.nih.gov/37524217/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S96989847"}, {"id": "10.1093/sysbio/syad056", "title": "Summary Tests of Introgression Are Highly Sensitive to Rate Variation Across Lineages", "authors": ["Lauren Frankel", "Cécile Ané"], "journal": "Systematic Biology", "date": "2023-09-08", "doi": "10.1093/sysbio/syad056", "url": "https://openalex.org/W4386624136", "abstract": "The evolutionary implications and frequency of hybridization and introgression are increasingly being recognized across the tree of life. To detect hybridization from multi-locus and genome-wide sequence data, a popular class of methods are based on summary statistics from subsets of 3 or 4 taxa. However, these methods often carry the assumption of a constant substitution rate across lineages and genes, which is commonly violated in many groups. In this work, we quantify the effects of rate variation on the D test (also known as ABBA-BABA test), the D3 test, and HyDe. All 3 tests are used widely across a range of taxonomic groups, in part because they are very fast to compute. We consider rate variation across species lineages, across genes, their lineage-by-gene interaction, and rate variation across gene-tree edges. We simulated species networks according to a birth-death-hybridization process, so as to capture a range of realistic species phylogenies. For all 3 methods tested, we found a marked increase in the false discovery of reticulation (type-1 error rate) when there is rate variation across species lineages. The D3 test was the most sensitive, with around 80% type-1 error, such that D3 appears to more sensitive to a departure from the clock than to the presence of reticulation. For all 3 tests, the power to detect hybridization events decreased as the number of hybridization events increased, indicating that multiple hybridization events can obscure one another if they occur within a small subset of taxa. Our study highlights the need to consider rate variation when using site-based summary statistics, and points to the advantages of methods that do not require assumptions on evolutionary rates across lineages or across genes.", "track": "B", "source": "OpenAlex", "openalex_source_id": "S65478581", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1371/journal.pgen.1010918", "title": "Allele surfing causes maladaptation in a Pacific salmon of conservation concern.", "authors": ["Rougemont Q", "Leroy T", "Rondeau EB", "Koop B", "Bernatchez L"], "journal": "PLoS genetics", "date": "2023-09-01", "doi": "10.1371/journal.pgen.1010918", "url": "https://pubmed.ncbi.nlm.nih.gov/37683018/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S103870658", "journal_h_index": null, "journal_citedness": null, "is_fish": true, "tier": 1}, {"id": "10.1016/j.ympev.2023.107863", "title": "Genomic data provide a robust phylogeny backbone for Rhodiola L. (Crassulaceae) and reveal extensive reticulate evolution during its rapid radiation.", "authors": ["Ren CQ", "Zhang DQ", "Liu XY", "Zhang JQ"], "journal": "Molecular phylogenetics and evolution", "date": "2023-09-01", "doi": "10.1016/j.ympev.2023.107863", "url": "https://pubmed.ncbi.nlm.nih.gov/37329933/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S96989847"}, {"id": "10.1371/journal.pgen.1010829", "title": "Segregational drift hinders the evolution of antibiotic resistance on polyploid replicons.", "authors": ["Garoña A", "Santer M", "Hülter NF", "Uecker H", "Dagan T"], "journal": "PLoS genetics", "date": "2023-08-01", "doi": "10.1371/journal.pgen.1010829", "url": "https://pubmed.ncbi.nlm.nih.gov/37535631/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S103870658", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1038/s41588-023-01459-y", "title": "Telomere-to-telomere assemblies of 142 strains characterize the genome structural landscape in Saccharomyces cerevisiae.", "authors": ["O'Donnell S", "Yue JX", "Saada OA", "Agier N", "Caradec C", "Cokelaer T", "De Chiara M", "Delmas S", "Dutreux F", "Fournier T", "Friedrich A", "Kornobis E", "Li J", "Miao Z", "Tattini L", "Schacherer J", "Liti G", "Fischer G"], "journal": "Nature genetics", "date": "2023-08-01", "doi": "10.1038/s41588-023-01459-y", "url": "https://pubmed.ncbi.nlm.nih.gov/37524789/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S137905309"}, {"id": "10.1016/j.ympev.2023.107772", "title": "A clue to the evolutionary history of modern East Asian flora: Insights from phylogeography and diterpenoid alkaloid distribution pattern of the Spiraea japonica complex.", "authors": ["Luo D", "Song MS", "Xu B", "Zhang Y", "Zhang JW", "Ma XG", "Hao XJ", "Sun H"], "journal": "Molecular phylogenetics and evolution", "date": "2023-07-01", "doi": "10.1016/j.ympev.2023.107772", "url": "https://pubmed.ncbi.nlm.nih.gov/36977458/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S96989847"}, {"id": "10.7554/elife.88398", "title": "Separating phases of allopolyploid evolution with resynthesized and natural Capsella bursa-pastoris", "authors": ["Tianlin Duan", "Adrien Sicard", "Sylvain Glémin", "Martin Lascoux"], "journal": "eLife", "date": "2023-06-26", "doi": "10.7554/elife.88398", "url": "https://openalex.org/W4382022256", "abstract": "Allopolyploidization is a frequent evolutionary transition in plants that combines whole-genome duplication (WGD) and interspecific hybridization. The genome of an allopolyploid species results from initial interactions between parental genomes and long-term evolution. Distinguishing the contributions of these two phases is essential to understanding the evolutionary trajectory of allopolyploid species. Here, we compared phenotypic and transcriptomic changes in natural and resynthesized Capsella allotetraploids with their diploid parental species. We focused on phenotypic traits associated with the selfing syndrome and on transcription-level phenomena such as expression-level dominance (ELD), transgressive expression (TRE), and homoeolog expression bias (HEB). We found that selfing syndrome, high pollen, and seed quality in natural allotetraploids likely resulted from long-term evolution. Similarly, TRE and most down-regulated ELD were only found in natural allopolyploids. Natural allotetraploids also had more ELD toward the self-fertilizing parental species than resynthesized allotetraploids, mirroring the establishment of the selfing syndrome. However, short-term changes mattered, and 40% of the cases of ELD in natural allotetraploids were already observed in resynthesized allotetraploids. Resynthesized allotetraploids showed striking variation of HEB among chromosomes and individuals. Homoeologous synapsis was its primary source and may still be a source of genetic variation in natural allotetraploids. In conclusion, both short- and long-term mechanisms contributed to transcriptomic and phenotypic changes in natural allotetraploids. However, the initial gene expression changes were largely reshaped during long-term evolution leading to further morphological changes.", "track": "B", "source": "OpenAlex", "openalex_source_id": "S1336409049", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syac071", "title": "Pervasive Introgression During Rapid Diversification of the European Mountain Genus Soldanella (L.) (Primulaceae).", "authors": ["Slovák M", "Melichárková A", "Štubňová EG", "Kučera J", "Mandáková T", "Smyčka J", "Lavergne S", "Passalacqua NG", "Vďačný P", "Paun O"], "journal": "Systematic biology", "date": "2023-06-17", "doi": "10.1093/sysbio/syac071", "url": "https://pubmed.ncbi.nlm.nih.gov/36331548/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S65478581", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syac077", "title": "Power of Bayesian and Heuristic Tests to Detect Cross-Species Introgression with Reference to Gene Flow in the Tamias quadrivittatus Group of North American Chipmunks.", "authors": ["Ji J", "Jackson DJ", "Leaché AD", "Yang Z"], "journal": "Systematic biology", "date": "2023-06-16", "doi": "10.1093/sysbio/syac077", "url": "https://pubmed.ncbi.nlm.nih.gov/36504374/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S65478581", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syad009", "title": "Phylogenetic Analysis of Allotetraploid Species Using Polarized Genomic Sequences.", "authors": ["Leal JL", "Milesi P", "Salojärvi J", "Lascoux M"], "journal": "Systematic biology", "date": "2023-06-16", "doi": "10.1093/sysbio/syad009", "url": "https://pubmed.ncbi.nlm.nih.gov/36932679/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S65478581", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syad026", "title": "Hybridization and Transgressive Evolution Generate Diversity in an Adaptive Radiation ofAnolisLizards", "authors": ["Guinevere O. U. Wogan", "Michael L. Yuan", "D. Luke Mahler", "Ian Wang"], "journal": "Systematic Biology", "date": "2023-04-25", "doi": "10.1093/sysbio/syad026", "url": "https://openalex.org/W4366997662", "abstract": "Interspecific hybridization may act as a major force contributing to the evolution of biodiversity. Although generally thought to reduce or constrain divergence between 2 species, hybridization can, paradoxically, promote divergence by increasing genetic variation or providing novel combinations of alleles that selection can act upon to move lineages toward new adaptive peaks. Hybridization may, then, play a key role in adaptive radiation by allowing lineages to diversify into new ecological space. Here, we test for signatures of historical hybridization in the Anolis lizards of Puerto Rico and evaluate 2 hypotheses for the role of hybridization in facilitating adaptive radiation-the hybrid swarm origins hypothesis and the syngameon hypothesis. Using whole genome sequences from all 10 species of Puerto Rican anoles, we calculated D and f-statistics (from ABBA-BABA tests) to test for introgression across the radiation and employed multispecies network coalescent methods to reconstruct phylogenetic networks that allow for hybridization. We then analyzed morphological data for these species to test for patterns consistent with transgressive evolution, a phenomenon in which the trait of a hybrid lineage is found outside of the range of its 2 parents. Our analyses uncovered strong evidence for introgression at multiple stages of the radiation, including support for an ancient hybrid origin of a clade comprising half of the extant Puerto Rican anole species. Moreover, we detected significant signals of transgressive evolution for 2 ecologically important traits, head length and toepad width, the latter of which has been described as a key innovation in Anolis. [Adaptive radiation; introgression; multispecies network coalescent; phenotypic evolution; phylogenetic network; reticulation; syngameon; transgressive segregation.].", "track": "B", "source": "OpenAlex", "openalex_source_id": "S65478581", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/molbev/msad074", "title": "Localizing Post-Admixture Adaptive Variants with Object Detection on Ancestry-Painted Chromosomes.", "authors": ["Hamid I", "Korunes KL", "Schrider DR", "Goldberg A"], "journal": "Molecular biology and evolution", "date": "2023-04-04", "doi": "10.1093/molbev/msad074", "url": "https://pubmed.ncbi.nlm.nih.gov/36947126/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S57552105", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.molp.2023.02.004", "title": "Structural variation (SV)-based pan-genome and GWAS reveal the impacts of SVs on the speciation and diversification of allotetraploid cottons.", "authors": ["Jin S", "Han Z", "Hu Y", "Si Z", "Dai F", "He L", "Cheng Y", "Li Y", "Zhao T", "Fang L", "Zhang T"], "journal": "Molecular plant", "date": "2023-04-03", "doi": "10.1016/j.molp.2023.02.004", "url": "https://pubmed.ncbi.nlm.nih.gov/36760124/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S150334665"}, {"id": "10.1093/molbev/msad058", "title": "Looking through the Ice: Cold-Adapted Vision in Antarctic Icefish", "authors": ["Casey McGrath"], "journal": "Molecular Biology and Evolution", "date": "2023-04-01", "doi": "10.1093/molbev/msad058", "url": "https://openalex.org/W4366340592", "abstract": "Antarctica may seem like a desolate place, but it is home to some of the most unique lifeforms on the planet. Despite the fact that land temperatures average around −60 °C and ocean temperatures hover near the freezing point of saltwater (−1.9 °C), a number of species thrive in this frigid habitat. Antarctic icefishes (Cryonotothenioidea) are a prime example, exhibiting remarkable adaptations that allow them to survive in the icy waters surrounding the continent. For example, these fish have evolved special “antifreeze” glycoproteins that prevent the formation of ice in their cells. Some icefishes are “white-blooded” due to no longer making hemoglobin, and some have lost the inducible heat shock response, a nearly universal molecular response to high temperatures. Adding to this repertoire of changes, a recent study published in Molecular Biology and Evolution reveals the genetic mechanisms by which the visual systems of Antarctic icefishes have adapted to both the extreme cold and the unique lighting conditions under Antarctic sea ice (Castiglione et al. 2023). A team of researchers, led by Gianni Castiglione (now at Vanderbilt University) and Belinda Chang (University of Toronto), set out to explore the impact of subzero temperatures on the function and evolution of the Antarctic icefish visual system. The authors focused on rhodopsin, a temperature-sensitive protein involved in vision under dim–light conditions. As noted by Castiglione, a key role for rhodopsin in cold adaptation was suggested by their previous research. “We had previously found cold adaptation in the rhodopsins of high-altitude catfishes from the Andes mountains, and this spurred us into investigating cold adaptation in rhodopsins from the Antarctic icefishes.” Indeed, the authors observed evidence of positive selection and accelerated rates of evolution in rhodopsins among Antarctic icefishes. Taking a closer look at the specific sites identified as candidates for positive selection, Castiglione and coauthors found two amino acid variants that were absent from other vertebrates. These changes are predicted to have occurred during two key periods in Antarctic icefish history: the evolution of antifreeze glycoproteins and the onset of freezing polar conditions. This timing suggests that these variants were associated with icefish adaptation and speciation in response to climatic events. To confirm the functional effects of these two amino acid variants, the researchers performed in vitro assays in which they created versions of rhodopsin containing each variant of interest. Both amino acid variants affected rhodopsin's kinetic profile, lowering the activation energy required for return to a “dark” conformation and likely compensating for a cold-induced decrease in rhodopsin's kinetic rate. In addition, one of the amino acid changes resulted in a shift in rhodopsin's light absorbance toward longer wavelengths. This dual functional change came as a surprise to Castiglione and his coauthors. “We were surprised to see that icefish rhodopsin has evolved mutations that can alter both the kinetics and absorbance of rhodopsin simultaneously. We predict that this allows the icefish to adapt their vision to red-shifted wavelengths under sea ice and to cold temperatures through very few mutations.” Interestingly, the amino acid changes observed in the Antarctic icefishes were distinct from those conferring cold adaptation in the high-altitude catfishes previously studied by the team, suggesting multiple pathways to adaptation in this protein. To continue this line of study, Castiglione and his colleagues hope to investigate cold adaptation in the rhodopsins of other cold-dwelling fish lineages, including Arctic fishes. “Arctic fishes share many of the cold-adapted phenotypes found in the Antarctic icefishes, such as antifreeze proteins. However, this convergent evolution appears to have been accomplished through divergent molecular mechanisms. We suspect this may be the case in rhodopsin as well.” Unfortunately, acquiring the data needed to conduct such an analysis may prove difficult. “A major obstacle to our research is the difficulty of collecting fishes from Antarctic and Arctic waters,” says Castiglione, “which limits us to publicly available datasets.” This task may become even more challenging in the future as these cold-adapted fish are increasingly affected by warming global temperatures. As Castiglione points out, “Climate change may alter the adaptive landscape of icefishes in the very near future, as sea ice continues to melt, forcing the icefish to very likely find themselves at an evolutionary “mismatch” between their environment and their genetics.”", "track": "B", "source": "OpenAlex", "openalex_source_id": "S57552105", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/molbev/msad053", "title": "Limited Song Mixing Without Genomic Gene Flow in a Contact Zone Between Two Songbird Species.", "authors": ["Wu L", "Dang J", "Tang L", "Cheng Y", "Song G", "Sun Y", "Martens J", "Päckert M", "Alström P", "Zhang D", "Jia C", "Lei F"], "journal": "Molecular biology and evolution", "date": "2023-03-04", "doi": "10.1093/molbev/msad053", "url": "https://pubmed.ncbi.nlm.nih.gov/36869752/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S57552105", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.ympev.2022.107682", "title": "Gene flow assessment helps to distinguish strong genomic structure from speciation in an Iberian ant-eating spider.", "authors": ["Ortiz D", "Pekár S", "Bryjová A"], "journal": "Molecular phylogenetics and evolution", "date": "2023-03-01", "doi": "10.1016/j.ympev.2022.107682", "url": "https://pubmed.ncbi.nlm.nih.gov/36574825/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S96989847"}, {"id": "10.1093/molbev/msac214", "title": "Loss of Heterozygosity Spectrum Depends on Ploidy Level in Natural Yeast Populations.", "authors": ["Dutta A", "Dutreux F", "Schacherer J"], "journal": "Molecular biology and evolution", "date": "2022-11-03", "doi": "10.1093/molbev/msac214", "url": "https://pubmed.ncbi.nlm.nih.gov/36205042/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S57552105", "journal_h_index" s, repetitive elements are assembled in specialised chromatin such as heterochromatin; however, apart from centromere- and telomere-associated repeats, little is known about chromatin-associated proteins that decorate these and other repetitive elements in kinetoplastids. Here, we utilise affinity selection of synthetic TALE DNA binding proteins designed to target specific repeat elements to identify enriched proteins by proteomics. Validating the approach, a telomere repeat binding TelR-TALE identifies many proteins previously implicated in telomere function. Furthermore, the 70R-TALE designed to bind 70 bp repeats indicates that proteins involved in DNA repair are enriched on these elements that reside adjacent to VSG genes. Interestingly, the 177 bp repeat binding 177R-TALE enriches for many kinetochore proteins, suggesting that intermediate-sized and mini-chromosomes assemble kinetochores related in composition to those located on the main megabase chromosomes. This provides a first insight into the chromatin landscape of repetitive regions of the trypanosome genome with relevance for their mechanisms of chromosome integrity, immune evasion, and cell replication.", "track": "C", "source": "OpenAlex", "openalex_source_id": "S1336409049", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1186/s13059-026-03993-4", "title": "Higher order repeat structures reflect diverging evolutionary paths in maize centromeres and knobs.", "authors": ["Piri RD", "Wang M", "Romay MC", "Buckler ES", "Dawe RK"], "journal": "Genome biology", "date": "2026-02-14", "doi": "10.1186/s13059-026-03993-4", "url": "https://pubmed.ncbi.nlm.nih.gov/41691274/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S81160022"}, {"id": "10.1186/s13059-026-03980-9", "title": "Haplotype-resolved and near telom ", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S81160022"}, {"id": "10.1186/s13059-025-03681-9", "title": "HELLS is required for maintaining proper DNA modification at human satellite repeats.", "authors": ["Guckelberger P", "Haut L", "Tornisiello R", "Kretzmer H", "Meissner A"], "journal": "Genome biology", "date": "2025-07-17", "doi": "10.1186/s13059-025-03681-9", "url": "https://pubmed.ncbi.nlm.nih.gov/40676590/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S81160022"}, {"id": "10.1186/s13059-025-03687-3", "title": "ZSCAN4 functions as a safeguard to maintain centromere integrity during oocyte meiosis.", "authors": ["Choi DY", "Leem J", "Lee C", "Oh JS"], "journal": "Genome biology", "date": "2025-07-15", "doi": "10.1186/s13059-025-03687-3", "url": "https://pubmed.ncbi.nlm.nih.gov/40665375/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S81160022"}, {"id": "10.1093/molbev/msaf173", "title": "Highlight: Deciphering the Remarkable Triple “Marriage-Arrangement” of Tristylous Flowering Plants", "authors": ["Pedro Andrade"], "journal": "Molecular Biology and Evolution", "date": "2025-07-15", "doi": "10.1093/molbev/msaf173", "url": "https://openalex.org/W4413167690", "abstract": "The flower is the evolutionary highlight of angiosperms, since this structure has facilitated the incredible diversification of reproductive strategies of these land plants. In most angiosperm species, each flower contains both female and male reproductive organs. The physical proximity of female and male organs increases the risk of self-fertilization and, consequently, of the long-term potential for inbreeding depression. Multiple strategies have evolved to avoid this risk. One such mechanism that has intrigued evolutionary biologists is heterostyly, which arises from inter-individual variation in the length of the style, the elongated section of the female reproductive organ (Barrett 2019). Heterostyly occurs more frequently as two-morph distyly, which is defined by long or short styles, with reciprocal short or long male stamens. However, a small number of angiosperm lineages have gone one step further and independently evolved tristyly—a trimorphic flower polymorphism in which individuals in a single interbreeding population can form either long- (L), mid- (M), or short-styled (S) flowers (Fig. 1). In both distyly and tristyly, the between-morph variation in the length of the female style and male stamens covaries with other floral traits, including differences in pollen size and female stigma morphology. These multiple trait correlations are presumed to reinforce barriers to selfing and to promote outcrossing. Tristyly is an unusual form of floral polymorphism. In tristylous angiosperms, such as these annual water hyacinths (Eichhornia paniculata) from Northeastern Brazil, individuals within a population can be long- (L), mid- (M), or short-styled (S) which promotes cross-pollination. This phenotypic variation, which is maintained through balancing selection, is controlled by epistatic interactions between two Mendelian loci, S and M. Xue et al. (2025) have now mapped these loci to the same chromosome, in two regions flanking a possible centromeric region of low recombination. Photos by Spencer C.H. Barrett; the inset scheme was adapted from Xue et al. (2025). Darwin himself was fascinated by this phenomenon, which he termed a complex triple “marriage-arrangement,” and many since him have been puzzled by its repeated origins throughout angiosperm evolution. The historical legacy of this evolutionary enigma attracted Haoran Xue, a Ph.D. candidate at the University of Toronto in Canada supervised by Spencer C. H. Barrett and Stephen I. Wright. Barrett has devoted many years investigating the evolution and ecology of tristyly, and Wright's lab focuses on plant evolutionary genomics. “When we started this project, the genomic basis of distyly had been elucidated in Primula and a few other families of angiosperms, but nothing was known regarding the more complex tristyly,” explains Xue. He added that in many distylous species, style length variation is governed by a single Mendelian locus (S) with two alternative alleles, each comprising multiple genes inherited as a single unit, a genetic architecture known as a supergene. Does tristyly follow a similar genetic architecture? Or do several unlinked loci with pleiotropic effects better explain the complex suite of correlated traits? Tristyly has evolved in six angiosperm families. Xue and colleagues chose to study the annual water hyacinth (Eichhornia paniculata), a species for which previous studies had identified two loci (S and M) underlying its trimorphic system. In their study, now published in Molecular Biology and Evolution (Xue et al. 2025), the authors built on this knowledge. They began by generating chromosome-level genome assemblies of individuals with different S and M genotypes. Then, they resequenced the genomes of 20 plants of each morph to conduct association mapping. The S locus was mapped to a large 63 Mbp region on chromosome 2, and the M locus to a different, but also large, 35 Mbp region within the same chromosome. Although non-overlapping, both loci were located on opposite ends of a single large region of low recombination, likely corresponding to the region surrounding the centromere. Fine-scale genetic mapping of phenotypes is notoriously difficult when large regions of association are involved. To identify candidate genes for the floral morphs within these large regions, the authors scanned the chromosome 2 sequence data for differences in coverage between morphs, suggestive of regions of hemizygosity. The authors chose this approach because structural variation had already been implicated in distyly. And indeed, the authors did identify two alternative alleles in the S locus that differed in length, strand orientation, and gene content. Two of the genes found exclusively in the dominant S allele were of particular interest: a homolog of HRGP, associated with cell wall growth, and a homolog of LAZY1, which regulates the distribution of the hormone auxin in cells. A similar analysis in the M locus allowed the authors to identify one gene that was missing in the recessive m haplotype. Strikingly, it was another LAZY1 homolog! The role of LAZY1 in auxin transport across plant tissues makes it a compelling candidate for controlling floral morphs characterized by organ lengths (Taniguchi et al. 2017). Genes of the LAZY1 family have been shown to regulate the distribution of auxin in plant cells in response to gravity, thus polarizing tissue growth; LAZY1 loss-of-function mutants in different species show reduced or disorganized growth of roots or branches. Transcriptomic data from multiple tissues and developmental stages of Brazilian water hyacinth flowers also supported a role for LAZY1 in tristyly. The LAZY1-S copy was expressed only in styles, and not in the male stamen, while the LAZY1-M copy was expressed in both female and male organs. While the specific molecular and cellular mechanisms that mediate the phenotypic response of each morph are still unknown, these results demonstrate organ-specific expression of these genes, and pave the way for detailed functional testing. But how did these alternative haplotypes evolve? When the authors searched for homologs of the implicated genes, they found potential progenitor paralogs of LAZY1 and HRGP on the very same chromosome 2, in different regions from each of their derived copies. Their patterns of nucleotide variation, scattered chromosomal distribution of these paralogs, and signatures of hemizygosity suggest that recurrent duplication events followed by neofunctionalization promoted the emergence of the three morphs. The authors infer that, from an ancestral long-styled phenotype, an initial duplication of LAZY1 gave rise to the S locus polymorphism, thus generating distyly with short and long morphs. Subsequently, another LAZY1 duplication created the M locus. The epistatic effects of these two loci lead to short-, mid-, and long-styled morphs, with potential functional contributions from the duplicated paralog of HRGP. The discovery of the identity of candidate genes underlying the tristylous floral polymorphism is a landmark chapter in this historical topic in evolutionary genetics. But it is far from the last. After all, part of the big mystery was rooted in not knowing the evolutionary pathways that could explain the convergent evolution of these similar phenotypes across angiosperm lineages. Could other tristylous polymorphisms be driven by similar supergene architectures? Does repeated co-option of the same genes explain the repeated evolution of tristyly? Xue concludes: “We would be excited to find out whether the molecular characteristics we describe are also a feature of the independent evolution of the tristylous polymorphism in other families, such as the Lythraceae or the Oxalidaceae. Hopefully, our paper will stimulate further work to find evidence of molecular convergence among tristylous families.” Want to learn more? Check out these other articles focusing on the genetics of flowering morphology recently published in Molecular Biology and Evolution: “Genetic Causes and Genomic Consequences of Breakdown of Distyly in Linum trigynum” (Gutiérrez-Valencia et al. 2024). “Genetic Mechanisms and Adaptive Benefits of Anthocyanin Red Stigmas in a Wind-Pollinated Tree” (Wang et al. 2025). “Genomic Patterns of Loss of Distyly and Polyploidization in Primroses” (Mora-Carrera et al. 2025).", "track": "C", "source": "OpenAlex", "openalex_source_id": "S57552105", "source_type": "journal", "source_is_core": true, "j enalex_source_id": "S2764671299"}, {"id": "10.1101/gr.276992.122", "title": "Chromatin structure influences rate and spectrum of spontaneous mutations in Neurospora crassa.", "authors": ["Villalba de la Peña M", "Summanen PAM", "Liukkonen M", "Kronholm I"], "journal": "Genome research", "date": "2023-04-01", "doi": "10.1101/gr.276992.122", "url": "https://pubmed.ncbi.nlm.nih.gov/36922001/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.molp.2023.03.012", "title": "Rice Gene Index: A comprehensive pan-genome database for comparative and functional genomics of Asian rice", "authors": ["Zhichao Yu", "Yongming Chen", "Yong Zhou", "Yulu Zhang", "Mengyuan Li", "Yidan Ouyang", "Dmytro Chebotarov", "Ramil Mauleon", "Hu Zhao", "Weibo Xie", "Kenneth L. McNally", "Rod A. Wing", "Weilong Guo", "Jianwei Zhang"], "journal": "Molecular Plant", "date": "2023-03-24", "doi": "10.1016/j.molp.2023.03.012", "url": "https://openalex.org/W4360821295", "abstract": "Asian rice (Oryza sativa) is the staple food for half the world and is a model crop that has been extensively studied. It contributes ∼20% of calories to the human diet (Stein et al., 2018Stein J.C. Yu Y. Copetti D. Zwickl D.J. Zhang L. Zhang C. Chougule K. Gao D. Iwata A. Goicoechea J.L. et al.Genomes of 13 domesticated and wild rice relatives highlight genetic conservation, turnover and innovation across the genus Oryza.Nat. Genet. 2018; 50: 285-296https://doi.org/10.1038/s41588-018-0040-0Crossref PubMed Scopus (278) Google Scholar). With the increase in global population and rapid changes in climate, rice breeders need to develop new and sustainable cultivars with higher yields, healthier grains, and reduced environmental footprints (Wing et al., 2018Wing R.A. Purugganan M.D. Zhang Q. The rice genome revolution: from an ancient grain to Green Super Rice.Nat. Rev. Genet. 2018; 19: 505-517https://doi.org/10.1038/s41576-018-0024-zCrossref PubMed Scopus (182) Google Scholar). Since the first gold-standard reference genome of rice variety Nipponbare was published (International Rice Genome Sequencing Project, 2005International Rice Genome Sequencing ProjectThe map-based sequence of the rice genome.Nature. 2005; 436: 793-800https://doi.org/10.1038/nature03895Crossref PubMed Scopus (3009) Google Scholar), an increasing number of rice accessions have been sequenced, assembled, and annotated with global efforts. Nowadays, a single reference genome is obviously insufficient to perform the genetic difference analysis for rice accessions. Therefore, the pan-genome has been proposed as a solution, which allows the discovery of more presence-absence variants compared with single-reference genome-based studies (Zhao et al., 2018Zhao Q. Feng Q. Lu H. Li Y. Wang A. Tian Q. Zhan Q. Lu Y. Zhang L. Huang T. et al.Pan-genome analysis highlights the extent of genomic variation in cultivated and wild rice.Nat. Genet. 2018; 50: 278-284https://doi.org/10.1038/s41588-018-0041-zCrossref PubMed Scopus (313) Google Scholar). Over the past years, several databases, such as RAP-db (https://rapdb.dna.affrc.go.jp), RGAP (http://rice.uga.edu), and Gramene (https://www.gramene.org), have long-term served rice genomic research by providing information based on one or a series of individual reference genomes. To integrate and utilize the genomic information of multiple accessions, we performed comparative analyses and established the user-friendly Rice Gene Index (RGI; https://riceome.hzau.edu.cn) platform. RGI is the first gene-based pan-genome database for rice. To set up a solid foundation for this database, we selected 16 platinum standard reference genomes of rice accessions that represent the major Asian rice subpopulations when K = 15 (Zhou et al., 2020Zhou Y. Chebotarov D. Kudrna D. Llaca V. Lee S. Rajasekar S. Mohammed N. Al-Bader N. Sobel-Sorenson C. Parakkal P. et al.A platinum standard pan-genome resource that represents the population structure of Asian rice.Sci. Data. 2020; 7: 113https://doi.org/10.1038/s41597-020-0438-2Crossref PubMed Scopus (47) Google Scholar; Song et al., 2021Song J.-M. Xie W.-Z. Wang S. Guo Y.-X. Koo D.-H. Kudrna D. Gong C. Huang Y. Feng J.-W. Zhang W. et al.Two gap-free reference genomes and a global view of the centromere architecture in rice.Mol. Plant. 2021; 14: 1757-1767https://doi.org/10.1016/j.molp.2021.06.018Abstract Full Text Full Text PDF PubMed Scopus (52) Google Scholar; Stein et al., 2018Stein J.C. Yu Y. Copetti D. Zwickl D.J. Zhang L. Zhang C. Chougule K. Gao D. Iwata A. Goicoechea J.L. et al.Genomes of 13 domesticated and wild rice relatives highlight genetic conservation, turnover and innovation across the genus Oryza.Nat. Genet. 2018; 50: 285-296https://doi.org/10.1038/s41588-018-0040-0Crossref PubMed Scopus (278) Google Scholar), (Figure 1A). Starting with a set of unified de novo annotations performed by Gramene (Zhou et al., 2023Zhou Y. Yu Z. Chebotarov D. Chougule K. Lu Z. Rivera L.F. Kathiresan N. Al-Bader N. Mohammed N. Alsantely A. et al.Pan-genome inversion index reveals evolutionary insights into the subpopulation structure of Asian rice.Nat. Commun. 2023; 14: 1567https://doi.org/10.1038/s41467-023-37004-yCrossref PubMed Scopus (1) Google Scholar) of 14 genomes and 4 published annotations including Minghui 63 (MH63), Zhenshan 97, and Nipponbare (RGAP and RAP-db) (Kawahara et al., 2013Kawahara Y. de la Bastide M. Hamilton J.P. Kanamori H. McCombie W.R. Ouyang S. Schwartz D.C. Tanaka T. Wu J. Zhou S. et al.Improvement of the Oryza sativa Nipponbare reference genome using next generation sequence and optical map data.Rice. 2013; 6: 4https://doi.org/10.1186/1939-8433-6-4Crossref Scopus (1064) Google Scholar; Sakai et al., 2013Sakai H. Lee S.S. Tanaka T. Numa H. Kim J. Kawahara Y. Wakimoto H. Yang C.-c. Iwamoto M. Abe T. et al.Rice annotation project database (RAP-DB): an integrative and interactive database for rice genomics.Plant Cell Physiol. 2013; 54: e6https://doi.org/10.1093/pcp/pcs183Crossref PubMed Scopus (470) Google Scholar), we incrementally integrated the genes and transcripts identified by newly sequenced isoform sequencing (Iso-Seq) data into the Gramene annotation results as the basics to build homology relationships between 18 annotations (Supplemental Table 1). In addition, a series of Iso-Seq and RNA-Seq data of multiple tissues from selected accessions (Supplemental Tables 2 and 3) were collected and fully presented as baseline information in RGI, which included gene expression, full-length transcripts, and alternative splicing (AS) events. Details on data processing are described in the supplemental methods. As the primary datasets in RGI, the genome annotations of 16 rice accessions contained an average of 41 346 genes, of which an average of 1178 genes are supplemented by Iso-Seq data (Supplemental Table 4). The GeneTribe pipeline (Chen et al., 2020Chen Y. Song W. Xie X. Wang Z. Guan P. Peng H. Jiao Y. Ni Z. Sun Q. Guo W. A collinearity-incorporating homology inference strategy for connecting emerging assemblies in the triticeae tribe as a pilot practice in the plant pangenomic era.Mol. Plant. 2020; 13: 1694-1708https://doi.org/10.1016/j.molp.2020.09.019Abstract Full Text Full Text PDF PubMed Scopus (75) Google Scholar) identified an average of 33 350 gene pairs between annotations (Supplemental Figure 2), which classified “reciprocal best hits,” “single-side best hits,” “one-to-many hits,” or “singleton hits.” By counting unique homolog gene groups, a total of 119 783 non-redundant gene groups were determined to represent the whole Asian rice gene set. To further unify the gene groups in Oryza sativa, we defined a unified and sustainable number—Ortholog Gene Index (OGI), which is a homolog group clustered by connected graph methods based on reciprocal best hit relationships, with an updatable score that indicates its representativeness in all accessions. Of the 112 658 OGIs, we classified them into 21 418 OGI core genes (19.01% of OGI) appearing in all rice accessions, 40 141 OGI dispensable genes, and 51 099 OGI accession-specific genes (Supplemental Figure 1A). And we found that the specific genes are younger and shorter (t-test, p = 2e−16) than core genes (supplemental information 1). The first objective of RGI is to logically organize and scientifically index all genes among rice accessions. RGI provides “GeneCard” pages to show comprehensive information for individual genes with convenient links to other modules and outside databases on one page (Figure 1C). By entering a gene ID of rice, through the search box on the homepage, users may browse the “GeneCard” page on three sections: 1) basic information includes sequence, gene function, gene expression, links for accessing various modules and other databases, etc. (Supplemental Figure 4A). 2) “Transcripts” exhibits graph and table of transcript structures. In addition to the baseline expression analysis of all genes, 116 640 AS events at the transcriptome level were extensively revealed by the analysis of different groups (Supplemental Figure 4B; Supplemental Table 5). For example, two AS events were detected for OsNiR (OsNip_01g0357100), a critical gene that encodes nitrite reductase in nitrogen assimilation (Yu et al., 2021Yu J. Xuan W. Tian Y. Fan L. Sun J. Tang W. Chen G. Wang B. Liu Y. Wu W. et al.Enhanced OsNLP4-OsNiR cascade confers nitrogen use efficiency by promoting tiller number in rice.Plant Biotechnol. J. 2021; 19: 167-176https://doi.org/10.1111/pbi.13450Crossref PubMed Scopus (41) Google Scholar) (Figure 1D). Additionally, “Homologues” lists all associated homologs of a gene across annotations through a link graph and a table. This section also shows the phylogenetic tree. Furthermore, RGI provides informative pages to show the association graph of genes in each OGI (Supplemental Figure 4C). Second, RGI provides three ways to search for relationships and comprehensive information for genes.1)Through keyword-based searches, users can easily search OGI#, gene ID, gene symbol, Gene Ontology, or functional terms in the query box. If users search the famous gene SD1 in RGI, 306 items will be returned with basic information, which could link to other modules or databases.2)In the way of sequence-based searches, the classical “BLAST” tool allows users to query amino acid or nucleotide sequences in sequence databases of the whole genome and protein. To easily access other modules, the tool returns gene ID linking to “GeneCard” or chromosome location linking to “JBrowse” when using the protein or nucleotide database, respectively.3)For association-based searches, the “Homologues” module allows users to query and connect the homologous genes through a given gene ID, which may obtain the homology relationship among annotations. By using TreePlot, users could build the phylogenetic tree with gene structures (Figure 1F) and view multiple sequence alignments of interested genes, as well as the detailed information of each gene. For example, OsTPP7 (LOC_Os09g20390), an anaerobic germination tolerance gene, was found to be absent in IR64 but present in other accessions by “Homologues” (Supplemental Table 6), and the results were manually verified. This indicates that IR64 has less tolerance to anaerobic germination (Yang et al., 2019Yang J. Sun K. Li D. Luo L. Liu Y. Huang M. Yang G. Liu H. Wang H. Chen Z. Guo T. Identification of stable QTLs and candidate genes involved in anaerobic germination tolerance in rice via high-density genetic mapping and RNA-Seq.BMC Genom. 2019; 20: 355https://doi.org/10.1186/s12864-019-5741-yCrossref PubMed Scopus (34) Google Scholar). Third, RGI can visualize the relationship of these annotated genes across accessions at local and global scales corresponding to two modules as follows.1)At the local scale, the “MicroCollinearity” module enables users to demonstrate genomic collinearities of a gene and its flanking genes in selected accessions (Figure 1E). The homologous relations among genomes help to investigate gene-based variations in the local regions of multiple accessions. Many genes encoding nucleotide-binding site leucine-rich repeat proteins are found in the region close to the end of rice chromosome 11 long arm (Supplemental Figure 5) (Song et al., 2021Song J.-M. Xie W.-Z. Wang S. Guo Y.-X. Koo D.-H. Kudrna D. Gong C. Huang Y. Feng J.-W. Zhang W. et al.Two gap-free reference genomes and a global view of the centromere architecture in rice.Mol. Plant. 2021; 14: 1757-1767https://doi.org/10.1016/j.molp.2021.06.018Abstract Full Text Full Text PDF PubMed Scopus (52) Google Scholar), and the collinearity comparison results detected by this module show that these nucleotide-binding site leucine-rich repeat genes are significantly more abundant in MH63 than in other accessions, which potentially contribute to MH63’s superior resistance to rice diseases.2)At the global scale, “MacroCollinearity” helps users to explore collinearity between accessions and study rearrangements of rice genome at the whole-chromosome level. With this module, structure variations may be easily detected, and the interactive tool “Dot Plot” was embedded to show the collinearity details and links to associated genome loci on “JBrowse” (Figure 1G). A useful module, “GenePair,” is provided to visualize collinearity comparisons of ortholog gene pairs between two accessions on both global and local scales. All information mentioned above is logically organized and seamlessly integrated by modules and tools in RGI. Four extra modules (“JBrowse” [Figure 1I], “GOEnrichment” [Figure 1H], “GeneDescription,” and “Download”) were additionally integrated to enhance RGI’s serviceability (supplemental information 2). The technical details on RGI construction of RGI are described in supplemental information 3. Although more than 100 chromosomal-level genomes of Asian rice have been published, most of the relevant databases focus on single genomes for specific domains (e.g., long non-coding RNA, epigenomic, etc.). Two “pan-genome” databases have been published (i.e., RPAN [https://cgm.sjtu.edu.cn/3kricedb/index.php] provides data on individual rice accessions, and Rice RC [http://ricerc.sicau.edu.cn/RiceRC] has a focus on structure variants), while our RGI comprehensively creates and focuses on gene-level relationships across representative Asian rice accessions, establishes a standardized gene index for Asian rice, and provides richer search and visualization capabilities for the whole rice research community. This research was supported by Fundamental Research Funds for the Central Universities (2662020SKPY010), the Major Project of Hubei Hongshan Laboratory (2022HSZD031), and Huazhong Agricultural University’s Start-up Fund to J.Z.", "track": "C", "source": "OpenAlex", "openalex_source_id": "S150334665", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/nar/gkad054", "title": "Epigenetic and chromosomal features drive transposon insertion in Drosophila melanogaster.", "authors": ["Cao J", "Yu T", "Xu B", "Hu Z", "Zhang XO", "Theurkauf WE", "Weng Z"], "journal": "Nucleic acids research", "date": "2023-03-21", "doi": "10.1093/nar/gkad054", "url": "https://pubmed.ncbi.nlm.nih.gov/36762470/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1038/s41467-023-37235-z", "title": "The structural flexibility of MAD1 facilitates the assembly of the Mitotic Checkpoint Complex.", "authors": ["Chen C", "Piano V", "Alex A", "Han SJY", "Huis In 't Veld PJ", "Roy B", "Fergle D", "Musacchio A", "Joglekar AP"], "journal": "Nature communications", "date": "2023-03-18", "doi": "10.1038/s41467-023-37235-z", "url": "https://pubmed.ncbi.nlm.nih.gov/36934097/", "abstract": "", "track": "C", "source uthors": ["Macas J", "Ávila Robledillo L", "Kreplak J", "Novák P", "Koblížková A", "Vrbová I", "Burstin J", "Neumann P"], "journal": "PLoS genetics", "date": "2023-02-01", "doi": "10.1371/journal.pgen.1010633", "url": "https://pubmed.ncbi.nlm.nih.gov/36735726/", "abstract": "", "track": "C", "source": "PubMed", "openalex_source_id": "S103870658", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.celrep.2022.111839", "title": "Principles of 3D chromosome folding and evolutionary genome reshuffling in mammals.", "authors": ["Álvarez-González L", "Arias-Sardá C", "Montes-Espuña L", "Marín-Gual L", "Vara C", "Lister NC", "Cuartero Y", "Garcia F", "Deakin J", "Renfree MB", "Robinson TJ", "Martí-Renom MA", "Waters PD", "Farré M", "Ruiz-Herrera A"], "journal": "Cell reports", "date": "2022-12-20", "doi": "10.1016/j.celrep.2022.111839", "url": "https://pubmed.ncbi.nlm.nih.gov/36543130/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S169236886"}, {"id": "10.1093/plcell/koac361", "title": "What makes a good reference? First steps toward a Chlamydomonas pangenome", "authors": ["Ching Chan", "Patrice A. Salomé"], "journal": "The Plant Cell", "date": "2022-12-12", "doi": "10.1093/plcell/koac361", "url": "https://openalex.org/W4311206005", "abstract": "Sequencing an “entire” genome used to be an accomplishment. However, improvements in sequencing technologies have resulted in an avalanche of genomes “in progress”; good enough to map transcriptome data, but largely insufficient for describing the “typical” genome of a given species. Which begs the question: what is a typical genome? In many plant species with high-quality single reference genomes, large collections of resequencing data are now available and offer a glimpse of what is called the pangenome: a compendium of all genes and polymorphisms in one species. In this issue of The Plant Cell, Craig et al. (2023) start to tackle this issue in the green unicellular alga Chlamydomonas (Chlamydomonas reinhardtii), whose first genome sequence and assembly was released 15 years ago (Merchant et al., 2007). Chlamydomonas boasts a large collection of molecular toolkits, as well as ample genetic resources, making it a popular species to study photosynthesis, chloroplast biology, and ciliary/flagellar function (Salomé and Merchant, 2019). Studies in Chlamydomonas have also substantially contributed to cell cycle research (Cross and Umen, 2015) and optogenetics (Deisseroth and Hegemann, 2017). Furthermore, Chlamydomonas genes are frequently used as a reference to transfer gene symbols and functional annotation to newly sequenced chlorophyte genomes. Initial sequencing efforts in the early 2000s culminated in the release of a (then) high-quality Sanger-based sequence of the Chlamydomonas genome for strain CC-503, which was chosen for its lack of a cell wall, at the time a prerequisite for the extraction of the large quantity of high-molecular-weight genomic DNA needed for such projects. Over the years, the CC-503 genome went through several refinements, but large and numerous gaps remained, with some inconsistencies, underscoring the need for further polishing. In addition, Chlamydomonas laboratory strains are peculiar for two reasons: One, unlike Arabidopsis (Arabidopsis thaliana) accessions or maize (Zea mays) inbred lines, with collectively many different polymorphisms at each locus, all laboratory Chlamydomonas strains are haploid and will harbor only one of two alleles (since all laboratory strains are derived from the same cross between two strains back in the 1940s). Two, just like yeast (Saccharomyces cerevisiae), Chlamydomonas strains come in two mating types, MT+ and MT–. Importantly, CC-503 is MT+; therefore, sequence from the MT– locus is absent. Let's now return to the idea of the pangenome. To improve assembly and explore the MT– locus, Craig et al. produced single-molecule, long PacBio reads for two strains: CC-503 (MT+) and CC-4532 (MT–), to improve upon the previous genome version (for CC-503, yielding version 6 or v6) and finally produce a quality assembly for an MT– strain (CC-4532; Figure). As hoped, most of the ∼1000 gaps in the previous genome version were filled in v6. Surprisingly, the CC-503 and CC-4532 genome assemblies were not fully contiguous, as indicated from linkage analysis performed by placing 239 classical molecular markers onto each genome assembly, suggesting potential genomic rearrangements on chromosomes 2 and 9. The authors speculated that these structural rearrangements were introduced during the repair of double-strand breaks that arose in the laboratory at some point over at least 50 years of subculturing. Moreover, the authors identified 46 structural mutations in the CC-503 v6 sequence that were not present in past versions, suggesting that the CC-503 genome is unstable. In fact, RECQ3, a helicase gene involved in maintaining genome stability, was fully deleted in all genome versions based on CC-503, making this strain an unsuitable reference. In a bit of a letdown, the high-quality genome assembly for CC-4532 also comes with its own sets of issues, with many large mutations and transposable element insertions, which likely arose in laboratory cultures, although the CC-4532 genome does harbor a full-length RECQ3 gene. One major conclusion from this work is that no single strain can ever be considered THE typical reference. Rather, each newly sequenced genome will become part of the Chlamydomonas pangenome. New genome assemblies for multiple strains reveal the MT+ and MT– alleles of the mating type locus. MTA and SRL denote MT+-specific regions; R, rearranged; T, telomere-proximal; C, centromere-proximal. Adapted from Craig et al. (2023), Figure 9. Because of the large rearrangements detected in CC-503, the authors reassigned all gene identifiers to CC-4532. Going forward, they also suggest that the strain name be included in the gene IDs, since not all genes will be present in all strains, and perhaps not in the same order. It will be important to maintain a highly structured and consistent gene naming system as new genes are identified and new strains sequenced, hopefully with many more samples taken from the wild. Indeed, other genomes for Chlamydomonas laboratory strains (Payne et al. 2022) and wild isolates (López-Cortegano et al. 2022) are already emerging alongside the version 6 genomes. In this sense, Chlamydomonas will light the way for its multicellular relatives on how to use a (pan)genome and call a (pan)gene.", "track": "C", "source": "OpenAlex", "openalex_source_id": "S48849333", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/nar/gkac1115", "title": "Pushing the limits of HiFi assemblies reveals centromere diversity between two Arabidopsis thaliana genomes.", "authors": ["Rabanal FA", "Gräff M", "Lanz C", "Fritschi K", "Llaca V", "Lang M", "Carbonell-Bejerano P", "Henderson I", "Weigel D"], "journal": "Nucleic acids research", "date": "2022-11-28", "doi": "10.1093/nar/gkac1115", "url": "https://pubmed.ncbi.nlm.nih.gov/36453992/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1038/s41467-022-34909-y", "title": "Chromosome segregation fidelity requires microtubule polyglutamylation by the cancer downregulated enzyme TTLL11.", "authors": ["Zadra I", "Jimenez-Delgado S", "Anglada-Girotto M", "Segura-Morales C", "Compton ZJ", "Janke C", "Serrano L", "Ruprecht V", "Vernos I"], "journal": "Nature communications", "date": "2022-11-21", "doi": "10.1038/s41467-022-34909-y", "url": "https://pubmed.ncbi.nlm.nih.gov/36414642/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null ying and quantifying the contacts of specific repeat families. As an output, our pipeline produces heatmaps showing contact frequency and circular diagrams visualizing repeat contact localization. Using our pipeline with tomato data, we revealed the preferential homotypic interactions of ribosomal DNA, centromeric satellites and some LTR retrotransposon families and, as expected, little contact between organellar and nuclear DNA elements. While the pipeline can be applied to any eukaryotic genome, results in plants provide better coverage, since the built-in TE-greedy-nester software only detects tandems and LTR retrotransposons. Other repeats can be fed via GFF3 files. This pipeline represents a novel and reproducible way to analyze the role of repetitive elements in the 3D organization of genomes. AVAILABILITY AND IMPLEMENTATION: https://gitlab.fi.muni.cz/lexa/hic-te/. SUPPLEMENTARY INFORMATION: Supplementary data are available at Bioinformatics online.", "track": "C", "source": "OpenAlex", "openalex_source_id": "S52395412", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1371/journal.pbio.3001671", "title": "Selfish centromeres and the wastefulness of human reproduction.", "authors": ["Hurst LD"], "journal": "PLoS biology", "date": "2022-07-01", "doi": "10.1371/journal.pbio.3001671", "url": "https://pubmed.ncbi.nlm.nih.gov/35788750/", "abstract": "", "track": "C", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/molbev/msac131", "title": "Recombination landscape divergence between populations is marked by larger low-recombining regions in domesticated rye.", "authors": ["Schreiber M", "Gao Y", "Koch N", "Fuchs J", "Heckmann S", "Himmelbach A", "Börner A", "Özkan H", "Maurer A", "Stein N", "Mascher M", "Dreissig S"], "journal": "Molecular biology and evolution", "date": "2022-06-11", "doi": "10.1093/mol       totalCountElem.textContent = String(total);
    }

    const newCountElem = document.getElementById('stat-new-count');
    if (newCountElem) {
      let countNew = 0;
      if (Number.isFinite(stats.new_this_week)) {
        countNew = stats.new_this_week;
      } else {
        countNew = allPapers.filter(p => isPaperNew(p.date, generatedAt)).length;
      }
      newCountElem.textContent = String(countNew);
    }

    renderTrendChart(stats.weekly_trend);
  }

  function renderTrendChart(weeklyTrend) {
    const container = document.getElementById('trend-chart-container');
    if (!container) return;

    if (!Array.isArray(weeklyTrend) || weeklyTrend.length === 0) {
      container.innerHTML = '<span style="font-size:0.8rem;color:var(--text-muted);">暂无趋势数据</span>';
      return;
    }

    const points = weeklyTrend.slice(-6).map(pt => {
      const cnt = Number.isFinite(pt.count) ? Math.max(0, pt.count) : 0;
      const wStr = typeof pt.week === 'string' ? pt.week : '';
      const shortWeek = wStr.includes('-') ? wStr.split('-')[1] || wStr : wStr;
      return { week: escapeHtml(shortWeek), count: cnt };
    });

    const maxVal = Math.max(...points.map(p => p.count), 1);
    const width = 300;
    const height = 70;
    const paddingL = 12;
    const paddingR = 12;
    const barWidth = 24;
    const gap = (width - paddingL - paddingR - points.length * barWidth) / Math.max(1, points.length - 1);

    let svg = `<svg viewBox="0 0 ${width} ${height}" class="trend-svg" role="img" aria-label="近6周趋势图">`;

    points.forEach((pt, i) => {
      const x = Math.round(paddingL + i * (barWidth + gap));
      const ratio = pt.count / maxVal;
      const barH = Math.round(ratio * 36);
      const renderH = pt.count > 0 ? Math.max(4, barH) : 2;
      const y = Math.round(52 - renderH);

      svg += `
        <g>
          <text x="${x + barWidth / 2}" y="${y - 4}" class="chart-value">${pt.count}</text>
          <rect x="${x}" y="${y}" width="${barWidth}" height="${renderH}" rx="3" class="chart-bar ${pt.count === maxVal ? 'chart-bar-max' : ''}" />
          <text x="${x + barWidth / 2}" y="65" class="chart-label">${pt.week}</text>
        </g>
      `;
    });

    svg += `</svg>`;
    container.innerHTML = `<div class="overflow-x-auto">${svg}</div>`;
  }

  function initTabs() {
    const container = document.getElementById('track-tabs-container');
    if (!container) return;

    let html = `<button type="button" class="track-tab active" data-track="ALL">全部文献 (${allPapers.length})</button>`;

    Object.keys(tracks).forEach(key => {
      const label = tracks[key]?.label || key;
      const count = (tracks[key]?.papers || []).length;
      html += `<button type="button" class="track-tab" data-track="${escapeHtml(key)}">${escapeHtml(label)} (${count})</button>`;
    });

    container.innerHTML = html;

    container.addEventListener('click', e => {
      const tab = e.target.closest('.track-tab');
      if (!tab) return;
      currentTrackKey = tab.dataset.track;
      container.querySelectorAll('.track-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.track === currentTrackKey);
      });
      renderPaperList();
    });
  }

  function initSourceFilters() {
    const container = document.getElementById('source-pills-container');
    if (!container) return;

    const sortedSources = Array.from(availableSources).sort();
    let html = '';
    sortedSources.forEach(src => {
      const safeSrc = escapeHtml(src);
      const active = selectedSources.has(src) ? 'active' : '';
      html += `
        <button type="button" class="source-pill ${active}" data-source="${safeSrc}">
          <span class="pill-checkbox"></span>
          <span>${safeSrc}</span>
        </button>
      `;
    });
    container.innerHTML = html;

    container.addEventListener('click', e => {
      const pill = e.target.closest('.source-pill');
      if (!pill) return;
      const src = pill.dataset.source;
      if (selectedSources.has(src)) {
        selectedSources.delete(src);
        pill.classList.remove('active');
      } else {
        selectedSources.add(src);
        pill.classList.add('active');
      }
      renderPaperList();
    });

    const toggleBtn = document.getElementById('toggle-sources-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        if (selectedSources.size === availableSources.size) {
          selectedSources.clear();
          container.querySelectorAll('.source-pill').forEach(p => p.classList.remove('active'));
        } else {
          availableSources.forEach(s => selectedSources.add(s));
          container.querySelectorAll('.source-pill').forEach(p => p.classList.add('active'));
        }
        renderPaperList();
      });
    }
  }

  function initTierFilters() {
    const container = document.getElementById('tier-pills-container');
    if (!container) return;

    const meta = [
      { tier: 1, label: 'T1 经典' },
      { tier: 2, label: 'T2 优质' },
      { tier: 3, label: 'T3 一般' },
      { tier: 0, label: '噪声（默认隐藏）' },
    ];
    availableTiers = new Set(allPapers.map(p => Number.isFinite(p.tier) ? p.tier : 3));

    let html = '';
    meta.forEach(m => {
      if (!availableTiers.has(m.tier)) return;
      const active = selectedTiers.has(m.tier) ? 'active' : '';
      html += `
        <button type="button" class="source-pill tier-pill tier-pill-${m.tier} ${active}" data-tier="${m.tier}">
          <span class="pill-checkbox"></span>
          <span>${m.label}</span>
        </button>
      `;
    });
    container.innerHTML = html;

    container.addEventListener('click', e => {
      const pill = e.target.closest('.tier-pill');
      if (!pill) return;
      const tier = Number(pill.dataset.tier);
      if (selectedTiers.has(tier)) {
        selectedTiers.delete(tier);
        pill.classList.remove('active');
      } else {
        selectedTiers.add(tier);
        pill.classList.add('active');
      }
      renderPaperList();
    });
  }

  function initSortToggle() {
    const container = document.getElementById('sort-toggle');
    if (!container) return;
    container.addEventListener('click', e => {
      const btn = e.target.closest('.sort-btn');
      if (!btn) return;
      sortMode = btn.dataset.sort;
      container.querySelectorAll('.sort-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.sort === sortMode));
      renderPaperList();
    });
  }

  function initSearch() {
    const input = document.getElementById('search-input');
    if (!input) return;
    input.addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderPaperList();
    });
  }

  function initThemeToggle() {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;

    function updateBtn() {
      const current = document.documentElement.getAttribute('data-theme');
      let isDark = false;
      if (current === 'dark') {
        isDark = true;
      } else if (current === 'light') {
        isDark = false;
      } else {
        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      btn.innerHTML = isDark
        ? `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> 浅色`
        : `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> 深色`;
    }

    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      let next;
      if (!current) {
        const isDarkSys = window.matchMedia('(prefers-color-scheme: dark)').matches;
        next = isDarkSys ? 'light' : 'dark';
      } else {
        next = current === 'dark' ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', next);
      updateBtn();
    });

    updateBtn();
  }

  function renderPaperList() {
    const listElem = document.getElementById('paper-list');
    const countElem = document.getElementById('filtered-count');
    if (!listElem) return;

    let filtered = allPapers.filter(paper => {
      if (currentTrackKey !== 'ALL' && paper._trackKey !== currentTrackKey) {
        return false;
      }
      if (paper.source && !selectedSources.has(paper.source)) {
        return false;
      }
      const paperTier = Number.isFinite(paper.tier) ? paper.tier : 3;
      if (!selectedTiers.has(paperTier)) {
        return false;
      }
      if (searchQuery) {
        const titleMatch = (paper.title || '').toLowerCase().includes(searchQuery);
        const abstractMatch = (paper.abstract || '').toLowerCase().includes(searchQuery);
        const authorMatch = Array.isArray(paper.authors) && paper.authors.some(a => typeof a === 'string' && a.toLowerCase().includes(searchQuery));
        if (!titleMatch && !abstractMatch && !authorMatch) {
          return false;
        }
      }
      return true;
    });

    const dateDesc = (a, b) => {
      const dA = a.date ? new Date(a.date).getTime() : 0;
      const dB = b.date ? new Date(b.date).getTime() : 0;
      return dB - dA;
    };

    if (sortMode === 'quality') {
      filtered.sort((a, b) => {
        const ta = Number.isFinite(a.tier) ? a.tier : 3;
        const tb = Number.isFinite(b.tier) ? b.tier : 3;
        if (ta !== tb) return ta - tb;
        const ha = Number.isFinite(a.journal_h_index) ? a.journal_h_index : -1;
        const hb = Number.isFinite(b.journal_h_index) ? b.journal_h_index : -1;
        if (ha !== hb) return hb - ha;
        return dateDesc(a, b);
      });
    } else {
      filtered.sort(dateDesc);
    }

    if (countElem) {
      countElem.textContent = `显示 ${filtered.length} / 共 ${allPapers.length} 篇文献`;
    }

    if (filtered.length === 0) {
      listElem.innerHTML = `<div class="empty-state">未找到符合筛选条件的文献</div>`;
      return;
    }

    let html = '';
    filtered.forEach(paper => {
      const isNew = isPaperNew(paper.date, generatedAt);
      const isExpanded = expandedPaperIndexes.has(paper._index);
      const validPaperUrl = safeUrl(paper.url, paper.doi);

      const authorsArr = Array.isArray(paper.authors) ? paper.authors.filter(a => typeof a === 'string') : [];
      let authorsStr = '';
      if (authorsArr.length > 3) {
        authorsStr = authorsArr.slice(0, 3).map(escapeHtml).join(', ') + ' 等';
      } else if (authorsArr.length > 0) {
        authorsStr = authorsArr.map(escapeHtml).join(', ');
      }

      const safeTitle = escapeHtml(paper.title || '无标题');
      const safeJournal = escapeHtml(paper.journal || '');
      const safeDate = escapeHtml(paper.date || '未知日期');
      const safeSource = escapeHtml(paper.source || 'Unknown');
      const safeTrackLabel = escapeHtml(paper._trackLabel || '');
      const safeAbstract = escapeHtml(paper.abstract || '');

      const sourceClass = 'badge-source-' + safeSource.toLowerCase();

      const paperTier = Number.isFinite(paper.tier) ? paper.tier : 3;
      const tierLabels = { 1: 'T1 经典', 2: 'T2 优质', 3: 'T3 一般', 0: '噪声' };
      const tierLabel = tierLabels[paperTier] || 'T3';
      const hIdx = Number.isFinite(paper.journal_h_index) ? paper.journal_h_index : null;
      const hIdxStr = hIdx !== null ? ` <span class="paper-hindex">(h-index ${hIdx})</span>` : '';

      html += `
        <div class="paper-card" data-index="${paper._index}">
          <div class="paper-header js-paper-header">
            <div class="paper-title">${safeTitle}</div>
            ${validPaperUrl ? `
              <a href="${escapeHtml(validPaperUrl)}" target="_blank" rel="noopener noreferrer" class="paper-external-link" title="查看原文/DOI">
                <span>原文</span>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            ` : ''}
          </div>

          <div class="paper-badges">
            <span class="badge badge-tier badge-tier-${paperTier}">${tierLabel}</span>
            ${isNew ? `<span class="badge badge-new">NEW</span>` : ''}
            <span class="badge badge-source ${sourceClass}">${safeSource}</span>
            ${safeTrackLabel ? `<span class="badge badge-track">${safeTrackLabel}</span>` : ''}
          </div>

          <div class="paper-meta">
            ${authorsStr ? `<span class="paper-authors">作者：${authorsStr}</span>` : ''}
            ${safeJournal ? `<span class="paper-journal">期刊：${safeJournal}${hIdxStr}</span>` : ''}
            <span class="paper-date">日期：${safeDate}</span>
          </div>

          ${safeAbstract ? `
            <button type="button" class="abstract-toggle-btn js-toggle-abstract ${isExpanded ? 'expanded' : ''}">
              <span>${isExpanded ? '收起摘要' : '展开摘要'}</span>
              <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="abstract-box ${isExpanded ? 'expanded' : ''}">
              ${safeAbstract}
            </div>
          ` : ''}
        </div>
      `;
    });

    listElem.innerHTML = html;
  }

  // Event Delegation for abstract expansion
  const listContainer = document.getElementById('paper-list');
  if (listContainer) {
    listContainer.addEventListener('click', e => {
      if (e.target.closest('.paper-external-link')) return;

      const headerClick = e.target.closest('.js-paper-header');
      const toggleBtnClick = e.target.closest('.js-toggle-abstract');

      if (headerClick || toggleBtnClick) {
        const card = e.target.closest('.paper-card');
        if (!card) return;
        const idx = card.dataset.index;
        if (expandedPaperIndexes.has(idx)) {
          expandedPaperIndexes.delete(idx);
        } else {
          expandedPaperIndexes.add(idx);
        }
        renderPaperList();
      }
    });
  }

  function start() {
    renderHeaderAndStats();
    initTabs();
    initSourceFilters();
    initTierFilters();
    initSortToggle();
    initSearch();
    initThemeToggle();
    renderPaperList();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
