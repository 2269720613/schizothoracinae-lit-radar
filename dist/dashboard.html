<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schizothoracinae Lit Radar - 科研文献看板</title>
<style>
  :root {
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --bg-tertiary: #f1f5f9;
    --bg-hover: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --accent-new: #ef4444;
    --accent-new-bg: #fef2f2;
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08);

    --source-openalex-bg: #dbeafe;
    --source-openalex-text: #1e40af;
    --source-pubmed-bg: #dcfce7;
    --source-pubmed-text: #166534;
    --source-biorxiv-bg: #ffedd5;
    --source-biorxiv-text: #9a3412;
    --source-cnki-bg: #f3e8ff;
    --source-cnki-text: #6b21a8;
    --source-default-bg: #e2e8f0;
    --source-default-text: #334155;

    --tier1-bg: #fef3c7;
    --tier1-text: #92400e;
    --tier2-bg: #dcfce7;
    --tier2-text: #166534;
    --tier3-bg: #e2e8f0;
    --tier3-text: #475569;
    --tier0-bg: #fee2e2;
    --tier0-text: #991b1b;

    --chart-bar-bg: #3b82f6;
    --chart-bar-hover: #2563eb;
    --chart-text: #64748b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-tertiary: #334155;
      --bg-hover: #2d3748;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: rgba(59, 130, 246, 0.15);
      --accent-new: #f87171;
      --accent-new-bg: rgba(239, 68, 68, 0.2);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);

      --source-openalex-bg: rgba(30, 64, 175, 0.35);
      --source-openalex-text: #93c5fd;
      --source-pubmed-bg: rgba(22, 101, 52, 0.35);
      --source-pubmed-text: #86efac;
      --source-biorxiv-bg: rgba(154, 52, 18, 0.35);
      --source-biorxiv-text: #fdba74;
      --source-cnki-bg: rgba(107, 33, 168, 0.35);
      --source-cnki-text: #d8b4fe;
      --source-default-bg: rgba(51, 65, 85, 0.5);
      --source-default-text: #cbd5e1;

      --tier1-bg: rgba(146, 64, 14, 0.35);
      --tier1-text: #fcd34d;
      --tier2-bg: rgba(22, 101, 52, 0.35);
      --tier2-text: #86efac;
      --tier3-bg: rgba(51, 65, 85, 0.5);
      --tier3-text: #cbd5e1;
      --tier0-bg: rgba(153, 27, 27, 0.3);
      --tier0-text: #fca5a5;

      --chart-bar-bg: #60a5fa;
      --chart-bar-hover: #93c5fd;
      --chart-text: #94a3b8;
    }
  }

  :root[data-theme="dark"] {
    --bg-body: #0f172a;
    --bg-card: #1e293b;
    --bg-tertiary: #334155;
    --bg-hover: #2d3748;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --border-color: #334155;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --primary-light: rgba(59, 130, 246, 0.15);
    --accent-new: #f87171;
    --accent-new-bg: rgba(239, 68, 68, 0.2);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);

    --source-openalex-bg: rgba(30, 64, 175, 0.35);
    --source-openalex-text: #93c5fd;
    --source-pubmed-bg: rgba(22, 101, 52, 0.35);
    --source-pubmed-text: #86efac;
    --source-biorxiv-bg: rgba(154, 52, 18, 0.35);
    --source-biorxiv-text: #fdba74;
    --source-cnki-bg: rgba(107, 33, 168, 0.35);
    --source-cnki-text: #d8b4fe;
    --source-default-bg: rgba(51, 65, 85, 0.5);
    --source-default-text: #cbd5e1;

    --tier1-bg: rgba(146, 64, 14, 0.35);
    --tier1-text: #fcd34d;
    --tier2-bg: rgba(22, 101, 52, 0.35);
    --tier2-text: #86efac;
    --tier3-bg: rgba(51, 65, 85, 0.5);
    --tier3-text: #cbd5e1;
    --tier0-bg: rgba(153, 27, 27, 0.3);
    --tier0-text: #fca5a5;

    --chart-bar-bg: #60a5fa;
    --chart-bar-hover: #93c5fd;
    --chart-text: #94a3b8;
  }

  :root[data-theme="light"] {
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --bg-tertiary: #f1f5f9;
    --bg-hover: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --accent-new: #ef4444;
    --accent-new-bg: #fef2f2;
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08);

    --source-openalex-bg: #dbeafe;
    --source-openalex-text: #1e40af;
    --source-pubmed-bg: #dcfce7;
    --source-pubmed-text: #166534;
    --source-biorxiv-bg: #ffedd5;
    --source-biorxiv-text: #9a3412;
    --source-cnki-bg: #f3e8ff;
    --source-cnki-text: #6b21a8;
    --source-default-bg: #e2e8f0;
    --source-default-text: #334155;

    --chart-bar-bg: #3b82f6;
    --chart-bar-hover: #2563eb;
    --chart-text: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, #app {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
  }

  .dashboard-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  .header-banner {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
  }

  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header-title-group h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-time {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .theme-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .theme-toggle-btn:hover {
    background: var(--border-color);
    color: var(--text-primary);
  }

  .icon {
    width: 16px;
    height: 16px;
    vertical-align: middle;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }

  .stat-card-highlight {
    border-color: var(--accent-new);
    background: linear-gradient(135deg, var(--bg-card) 80%, var(--accent-new-bg));
  }

  .stat-title {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .stat-value {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-top: 4px;
  }

  .stat-card-highlight .stat-value {
    color: var(--accent-new);
  }

  .stat-badge-pulse {
    position: absolute;
    top: 14px;
    right: 16px;
    background: var(--accent-new);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .trend-chart-wrapper {
    margin-top: 8px;
  }

  .overflow-x-auto {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .trend-svg {
    width: 100%;
    max-width: 320px;
    height: 70px;
    display: block;
  }

  .chart-bar {
    fill: var(--chart-bar-bg);
    transition: fill 0.2s ease;
  }

  .chart-bar:hover, .chart-bar-max {
    fill: var(--primary);
  }

  .chart-value {
    fill: var(--text-secondary);
    font-size: 10px;
    font-weight: 600;
    text-anchor: middle;
  }

  .chart-label {
    fill: var(--chart-text);
    font-size: 9px;
    text-anchor: middle;
  }

  .controls-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .search-box {
    position: relative;
    width: 100%;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 18px;
    height: 18px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--primary);
    background: var(--bg-card);
  }

  .source-filter-wrapper {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .filter-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .source-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .source-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-size: 0.82rem;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  .source-pill:hover {
    border-color: var(--primary);
  }

  .source-pill.active {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }

  .pill-checkbox {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid var(--text-muted);
    display: inline-block;
    position: relative;
  }

  .source-pill.active .pill-checkbox {
    background: var(--primary);
    border-color: var(--primary);
  }

  .source-pill.active .pill-checkbox::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 1px;
    width: 3px;
    height: 6px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }

  .btn-toggle-all {
    background: transparent;
    border: none;
    color: var(--primary);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    text-decoration: underline;
  }

  .tabs-container {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid var(--border-color);
    margin-bottom: 16px;
    overflow-x: auto;
  }

  .track-tab {
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .track-tab:hover {
    color: var(--text-primary);
  }

  .track-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .filtered-meta-row {
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .paper-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .paper-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .paper-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--text-muted);
  }

  .paper-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
  }

  .paper-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    flex: 1;
  }

  .paper-title:hover {
    color: var(--primary);
  }

  .paper-external-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.8rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .paper-external-link:hover {
    background: var(--primary);
    color: #ffffff;
  }

  .paper-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .badge {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
  }

  .badge-new {
    background: var(--accent-new);
    color: #ffffff;
  }

  .badge-source {
    background: var(--source-default-bg);
    color: var(--source-default-text);
  }

  .badge-source-openalex {
    background: var(--source-openalex-bg);
    color: var(--source-openalex-text);
  }

  .badge-source-pubmed {
    background: var(--source-pubmed-bg);
    color: var(--source-pubmed-text);
  }

  .badge-source-biorxiv {
    background: var(--source-biorxiv-bg);
    color: var(--source-biorxiv-text);
  }

  .badge-source-cnki {
    background: var(--source-cnki-bg);
    color: var(--source-cnki-text);
  }

  .badge-tier {
    background: var(--tier3-bg);
    color: var(--tier3-text);
  }

  .badge-tier-1 { background: var(--tier1-bg); color: var(--tier1-text); }
  .badge-tier-2 { background: var(--tier2-bg); color: var(--tier2-text); }
  .badge-tier-3 { background: var(--tier3-bg); color: var(--tier3-text); }
  .badge-tier-0 { background: var(--tier0-bg); color: var(--tier0-text); }

  .tier-pill.tier-pill-1.active { background: var(--tier1-bg); border-color: var(--tier1-text); color: var(--tier1-text); }
  .tier-pill.tier-pill-2.active { background: var(--tier2-bg); border-color: var(--tier2-text); color: var(--tier2-text); }
  .tier-pill.tier-pill-3.active { background: var(--tier3-bg); border-color: var(--tier3-text); color: var(--tier3-text); }
  .tier-pill.tier-pill-0.active { background: var(--tier0-bg); border-color: var(--tier0-text); color: var(--tier0-text); }

  .paper-hindex { color: var(--text-muted); font-style: normal; }

  .filter-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sort-toggle {
    display: inline-flex;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
  }

  .sort-btn {
    background: var(--bg-tertiary);
    border: none;
    color: var(--text-secondary);
    font-size: 0.82rem;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .sort-btn.active {
    background: var(--primary);
    color: #ffffff;
    font-weight: 600;
  }

  .badge-track {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .paper-meta {
    font-size: 0.85rem;
    color: var(--text-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 8px;
  }

  .paper-authors {
    color: var(--text-secondary);
  }

  .paper-journal {
    color: var(--text-muted);
    font-style: italic;
  }

  .paper-date {
    color: var(--text-muted);
  }

  .abstract-toggle-btn {
    background: transparent;
    border: none;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    padding: 2px 0;
  }

  .chevron {
    transition: transform 0.2s ease;
  }

  .abstract-toggle-btn.expanded .chevron {
    transform: rotate(180deg);
  }

  .abstract-box {
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.6;
    border-left: 3px solid var(--primary);
  }

  .abstract-box.expanded {
    display: block;
  }


  .empty-state {
    text-align: center;
    padding: 40px 20px;
    background: var(--bg-card);
    border: 1px dashed var(--border-color);
    border-radius: 12px;
    color: var(--text-muted);
  }
</style>

<div id="app">
  <header class="header-banner">
    <div class="header-content">
      <div class="header-title-group">
        <h1>
          <svg class="icon" style="width:22px;height:22px;color:var(--primary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l5 4"/></svg>
          Schizothoracinae Lit Radar 看板
        </h1>
        <div class="header-time" id="generated-at-display">更新时间：加载中...</div>
      </div>
      <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="切换主题">
        <!-- Theme Icon JS inserted -->
      </button>
    </div>
  </header>

  <main class="dashboard-container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">文献总数</div>
        <div class="stat-value" id="stat-total-count">0</div>
      </div>

      <div class="stat-card stat-card-highlight">
        <div class="stat-title">本周新增</div>
        <div class="stat-value" id="stat-new-count">0</div>
        <span class="stat-badge-pulse">NEW</span>
      </div>

      <div class="stat-card stat-card-trend">
        <div class="stat-title">近 6 周新增趋势</div>
        <div class="trend-chart-wrapper" id="trend-chart-container">
          <!-- SVG rendered here -->
        </div>
      </div>
    </div>

    <div class="controls-card">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="按标题、摘要或作者关键字检索..." aria-label="搜索文献" />
      </div>

      <div class="source-filter-wrapper">
        <span class="filter-label">来源数据库：</span>
        <div class="source-pills" id="source-pills-container">

"], "journal": "Molecular phylogenetics and evolution", "date": "2026-10-01", "doi": "10.1016/j.ympev.2026.108652", "url": "https://pubmed.ncbi.nlm.nih.gov/42276466/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S96989847", "is_fish": false}, {"id": "10.1016/j.ympev.2026.108665", "title": "Comparative phylogeography of three Cletus species pairs reveals shared responses to quaternary environmental change.", "authors": ["Dong X", "Tang Z", "Zhang Y", "Zhu X", "Zhang H", "An J", "Bu W"], "journal": "Molecular phylogenetics and evolution", "date": "2026-10-01", "doi": "10.1016/j.ympev.2026.108665", "url": "https://pubmed.ncbi.nlm.nih.gov/42276465/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S96989847", "is_fish": false}, {"id": "10.1371/journal.pbio.3003964", "title": "Metabolic and developmental rate divergence between serially homologous cells underlies an evolutionary innovation in Drosophila", "authors": ["Ben R. Hopkins", "Olga Barmina", "Xinying Wang", "Mandy Situ", "Haley A. Bolanos", "Shizhan Nie", "Artyom Kopp"], "journal": "PLoS Biology", "date": "2026-08-24", "doi": "10.1371/journal.pbio.3003964", "url": "https://openalex.org/W7204100932", "abstract": "The individualization of serially repeated homologs is one route through which novel traits are thought to evolve. Under this model, a repeated character-like a limb, digit, or sensory bristle-is individualized from its homologs by changes in the regulatory apparatus ('character identity network', ChIN) that specifies its development. Individualization then enables downstream gene networks that build the repeated character to diverge from one another in different parts of the body, ultimately allowing new phenotypic endpoints to be reached. Despite this model's intuitive appeal, the genetic mechanisms through which new ChINs rewire trait-building gene networks remain largely uncharacterized. A promising system in which to study this process is the Drosophila sex comb. Found in a sublineage of Drosophila species, the sex comb is a recently evolved, male-specific innovation that evolved from a more evolutionarily ancient precursor-the mechanosensory (MS) bristle-following the gain of a novel ChIN centered on the sex determination gene dsx and HOX gene Scr. Here, we use time-series single-cell RNA-seq to show that rather than co-opting new genes, this new ChIN orchestrates quantitative and heterochronic changes in the ancestral MS bristle transcriptome. These changes affect gene modules that control energy metabolism, endoreplication, and actin dynamics. The net effect of these changes is an organ-specific shift in developmental rate, leading to accelerated growth in sex comb teeth. Collectively, our work suggests that morphological innovation can proceed without the co-option of new genes into downstream trait-building networks and instead through metabolically driven differences in developmental rate between serial homologs.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S154343897", "is_fish": false}, {"id": "10.1038/s41467-026-76091-5", "title": "A transmembrane protein confers the Yr26/Yr24/YrCH42/YrG22-mediated stripe rust resistance in wheat", "authors": ["Shengjie Liu", "Keqing Mu", "Shuqing Yang", "Jianhui Wu", "Mingjie Xiang", "Xiangrui Cheng", "Xiaoting Wang", "Yibo Zhang", "Ying Zhao", "Jiangna Han", "Shuo Huang", "Haitao Dong", "Jiwen Zhao", "Fengping Yuan", "R. K. Sharma", "Michael Norman", "Peidu Chen", "Aizhong Cao", "Weijun Zheng", "Chunlian Li", "Jaroslav Doležel", "Kateřina HolušováJ", "John P. Rathjen", "Evans Lagudah", "Xiaojie Wang", "Zhensheng Kang", "Sambasivam Periyannan", "Dejun Han", "Qingdong Zeng"], "journal": "Nature Communications", "date": "2026-08-24", "doi": "10.1038/s41467-026-76091-5", "url": "https://openalex.org/W7204149165", "abstract": "Abstract Stripe or yellow rust (YR), caused by Puccinia striiformis Westend. f. sp. tritici ( Pst ), is a devastating fungal disease of wheat. Here, we report the map-based cloning of Yr26 (synonyms: Yr24 , YrCH42 , and YrG22 ), a major stripe rust resistance gene, and its validation by gene silencing, mutation analysis and transgenic complementation. Yr26 , which firstly arises in emmer wheat and recently has introgressed into bread wheat, is a newly evolved gene encoding a transmembrane protein. AlphaFold v3.0 predictes a C-terminal four-helical bundle domain that is critical for triggering Ca 2+ -dependent cell death, a hallmark of the hypersensitive response. The cloning of Yr26 offers not only a genetic resource for pyramiding stripe rust resistance genes in wheat breeding but also an opportunity to study host–pathogen co-evolution.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1038/s41467-026-76911-8", "title": "HOMEODOMAIN-LIKE shapes chromatin architecture and rewires leaf epidermal patterns", "authors": ["Ansar Ali", "Chi Kuan", "Tsai-Chen Chen", "Fu‐Yu Hung", "Pei-Yu Lin", "Ding Hua Lee", "Guan-Jun Lin", "Hui-Chun Lee", "Shao‐Li Yang", "Yun‐Ru Feng", "Rachel Wang", "Pao‐Yang Chen", "Keqiang Wu", "Chin‐Min Kimmy Ho"], "journal": "Nature Communications", "date": "2026-08-22", "doi": "10.1038/s41467-026-76911-8", "url": "https://openalex.org/W7203970254", "abstract": "During development, cells balance proliferation and differentiation to generate diverse cell types, yet how these transitions are fine-tuned remains unclear. In the Arabidopsis leaf epidermis, stomata form through regulated cell division, whereas pavement cells and trichomes arise through differentiation, making this tissue a tractable system for identifying modulators of developmental decisions. Here, we identified a previously uncharacterized homeodomain-like protein HDL, that is required for chromocenter organization through interactions with the histone deacetylase HDA6 and the methyltransferase KRYPTONITE. hdl mutants exhibit disrupted chromocenters and reduced cell division, resulting in fewer stomata and increased trichome formation. Chromatin immunoprecipitation and ATAC-sequencing reveal increased chromatin accessibility at HDL-associated regions and reduced accessibility and expression of stomatal lineage–related genes. Chromatin-state and H3K9me2 analyses further suggest that HDL functions as a chromatin organizer that maintains epigenetic balance at the interface between active and repressive chromatin domains, thereby shaping genome-wide transcriptional programs. Together, these findings identify HDL as a chromatin-associated factor linked to coordinated changes in chromocenter architecture and developmental plasticity. How chromatin organization influences developmental decisions remains poorly understood. Here the authors report a chromatin organizer that maintains higher-order genome organization and coordinated gene expression to balance cell division and differentiation in plants.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1016/j.ympev.2026.108722", "title": "Genome-wide SNP data support species boundaries in sympatric Polylepis Ruiz & Pav. (Rosaceae) species from Bolivia and Ecuador", "authors": ["Jay Edneil C. Olivar", "Marcus Lehnert", "Walter Durka", "Stefan Michalski", "Christian Ritz", "Jana Ebersbach", "Alexandra N. Muellner-Riehl", "Claudia Segovia-Salcedo", "Sofía Acosta-Villamarín", "Katya Romoleroux", "Erika Priscilla Muriel Mera", "Emilio J. Trujillo", "Edgar E. Gareca", "Milton Fernández", "Magaly Mercado", "Adriana Rojas", "Susana Arrazola", "Isabell Hensen", "Michael Kessler"], "journal": "Molecular Phylogenetics and Evolution", "date": "2026-08-22", "doi": "10.1016/j.ympev.2026.108722", "url": "https://openalex.org/W7203974713", "abstract": "Species delimitation in the South American genus Polylepis is notoriously challenging due to high morphological similarity and phenotypic plasticity, likely driven by hybridization and gene flow. Previous phylogenetic studies suggested that genetic structure aligns more strongly with geography than with taxonomy, questioning existing species concepts and hampering conservation efforts. We used double-digest RAD sequencing (ddRADseq) to generate genome-wide SNP data for 11 Polylepis species sampled across multiple localities in Bolivia and Ecuador. Population genetic analyses, phylogenetic inference, and network approaches were combined to assess whether genetic structure aligns more closely with taxonomy or geography. Morphologically defined species formed largely cohesive genetic lineages across regions, with species identity explaining substantially more genetic variation than locality. While localized admixture and reticulation were detected among closely related taxa, widespread species showed strong genetic cohesion and clear separation from congeners. Our results indicate that the sampled Polylepis species from Bolivia and Ecuador maintain distinct genetic identities despite localized signals consistent with gene flow. This genome-wide support for current taxonomy highlights Polylepis as a valuable model for studying speciation under gene flow and indicates that multiple geographic sampling will be essential in reconstructing a robust phylogeny of the genus, with important implications for conservation planning in Andean montane forests.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S96989847", "is_fish": false}, {"id": "10.1371/journal.pcbi.1014603", "title": "A portable recalibration workflow for reference-based variant calling in non-human genomes", "authors": ["Hyeonjung Lee", "Sunhee Kim", "Michelle Audrelia Sunartha", "Chang-Yong Lee", "Young-Suk Lee"], "journal": "PLoS Computational Biology", "date": "2026-08-20", "doi": "10.1371/journal.pcbi.1014603", "url": "https://openalex.org/W7203838318", "abstract": "A key computational step in reference-based variant calling is distinguishing true genetic variants from sequencing errors. Advanced tools and workflows have been developed to handle this by computational modelling of technical errors from the sequencing machines. However, these recalibration workflows have largely been evaluated for human data only and its exact applicability for non-human data remains unknown. Here, we conducted a systematic evaluation of variant calling on human, rice, sheep, and chickpea data, and found that existing workflows introduce unexpected statistical bias, thus leading to suboptimal variant calls for non-human data. To address this problem, we present simple guidelines for constructing a \"pseudo-\"database (pseudoDB) of genetic variants as a scalable and portable solution for recalibration and variant calling. With human data, our pseudoDB-based workflow performs comparably to existing dbSNP-based GATK3 workflows and those using DeepVariant, Strelka2, and FreeBayes. We extend this to other non-human genomes, namely cattle, brown bear, swan goose, African oil palm, Komodo dragon, and stevia, altogether resulting in the identification of up to 242.0% unique genetic variants. The majority of newly identified variants are within the non-coding regions, hinting at the rich diversity of genome regulation in the non-human population. Our pseudoDB-based workflow is agnostic to reference genomes and modular for easy integration with other computational workflows for human and non-human resequencing data.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S86033158", "is_fish": false}, {"id": "10.1038/s41467-026-76753-4", "title": "Unveiling centromeric retrotransposon dynamics through a high-quality rye genome assembly", "authors": ["Erwang Chen", "Carlotta Marie Wehrkamp", "Srijan Jhingan", "Thomas Lux", "Zihao Zhu", "Jianyong Chen", "Zuzana Tulpová", "Axel Himmelbach", "Jörg Fuchs", "Jia‐Wu Feng", "M. Timothy Rabanus‐Wallace", "Hana Šimková", "M. Spannagl", "Martin Mascher", "Thomas Wicker", "Andreas Houben", "Nils Stein"], "journal": "Nature Communications", "date": "2026-08-15", "doi": "10.1038/s41467-026-76753-4", "url": "https://openalex.org/W7171643457", "abstract": "Rye (Secale cereale L.) is an important cereal crop known for its high yield potential and tolerance to biotic and abiotic stresses. However, its large, repeat-rich, and heterozygous genome has posed challenges for assembly compared to related species such as wheat and barley. Here, we present a high-quality, chromosome-scale genome assembly of the inbred line Lo7, generated using PacBio HiFi, Oxford Nanopore, Hi-C, and BioNano technologies with the TRITEX pipeline. The resulting Lo7_V3 assembly spans 6.76 Gb with a contig N50 of 128 Mb, correcting previous misorientations and fully assembling all seven centromeres. Repetitive clusters containing rye-specific satellite sequences (pSc200 and pSc250) are contiguously assembled. Their chromosomal positions are validated using FISH. Centromeric retrotransposon analysis reveals RLG_Abia and RLG_Abigail as abundant, recently active elements, unlike in wheat. Collectively, the Lo7_V3 genome assembly provides an improved genomic resource for future genomic research in rye and related cereal species.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1126/sciadv.aea7469", "title": "Jomon genomics reveal cold adaptation in Upper Paleolithic hunter-gatherers of eastern Eurasia.", "authors": ["Watanabe Y", "Wakiyama Y", "Waku D", "Valverde G", "Tanino A", "Hayashi M", "Naka I", "Nakamura Y", "Suzuki T", "Koganebuchi K", "Gakuhari T", "Katsumura T", "Ogawa M", "Toyoda A", "Nuchnoi P", "Chaorattanakawee S", "Hananantachai H", "Patarapotikul J", "Mizushima S", "Nagaoka T", "Hirata K", "Yoneda M", "Motoi M", "Toyoshima H", "Maeda T", "Nishimura T", "Masuyama T", "Yamada Y", "Takahashi R", "Izuho M", "Ohashi J", "NCBN Controls WGS Consortium", "Oota H"], "journal": "Science advances", "date": "2026-08-14", "doi": "10.1126/sciadv.aea7469", "url": "https://pubmed.ncbi.nlm.nih.gov/42585312/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S2737427234", "is_fish": false}, {"id": "10.1016/j.ympev.2026.108717", "title": "Beyond species trees: pervasive gene flow limits phylogenomic resolution in the diversification of Juniperus from the Qinghai-Tibet Plateau.", "authors": ["Zhang Y", "Li J", "Wu D", "Yang H", "Han Z", "Mao K"], "journal": "Molecular phylogenetics and evolution", "date": "2026-08-14", "doi": "10.1016/j.ympev.2026.108717", "url": "https://pubmed.ncbi.nlm.nih.gov/42600876/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S96989847", "is_fish": false}, {"id": "10.1093/molbev/msag202", "title": "Population structure and punctuated genomic hyper-diversity in <i>Caenorhabditis briggsae</i>", "authors": ["Nicolas D. Moya", "Bowen Wang", "Robyn E. Tanny", "Michael E G Sauria", "L O'Connor", "Ayeh Khorshidian", "Ryan McKeown", "Charlie Gosse", "Clayton M. Dilks", "Timothy A. Crombie", "Gaotian Zhang", "Emha Rais", "Lise Frézal", "Viet Dai Dang", "Elkana Haryoso", "M. P. Devi", "Clotilde Gimond", "Daniel E. Cook", "Jung-Chen Hsu", "Amanda O. Shaver", "Stefan Zdraljevic", "Aurélien Richaud", "Tongshu Wen", "Aatira Mehraj", "Sharanya H", "Karthick Raja Arulprakasam", "Emily Koury", "Nicole M. Roberto", "Etta S. Schaye", "Varsha Singh", "Hagus Tarno", "Michael Ailion", "Annalise B. Paaby", "Zhongying Zhao", "Asher D. Cutter", "John Wang", "Matthew V. Rockman", "Marie-Anne Félix", "Christian Braendle", "Erik C. Andersen"], "journal": "Molecular Biology and Evolution", "date": "2026-08-12", "doi": "10.1093/molbev/msag202", "url": "https://openalex.org/W7202279562", "abstract": "Abstract Comparative genomics provides a powerful framework to uncover the molecular and evolutionary mechanisms that shape genetic diversity, revealing how shared or lineage-specific processes influence their evolutionary trajectories. The nematode Caenorhabditis briggsae is distributed world-wide and is a comparative model to Caenorhabditis elegans in the biology of development, cellular mechanisms, neurobiology, complex trait mappings, and evolution. Following massive collection efforts by the nematode research community, we present the isolation of over 1,900 wild strains and analyses of genome sequences that catalog over six million single-nucleotide and insertion-deletion variants. These resources provide a powerful means to interrogate the causal genetic bases of phenotypic variation. Additionally, we describe C. briggsae population structure and discover new, genetically distinct groups within this primarily self-fertilizing species, including groups of highly related strains sampled across entire continents. We leverage expansive genetic variation to decipher the effects of linkage and selection on the distribution of genetic diversity across the genome and across geographic regions. Within the species, we find genomic regions with extremely high levels of genetic variation similar to hyper-divergent regions found in C. elegans and other species. These regions harbor new genes and variation enriched for environmental sensing and pathogen responses. Based on comparisons to the outbreeding sister species Caenorhabditis nigoni, we conclude that long-term balancing selection has maintained substantial functional variation, likely associated with ecological variation, within C. briggsae since its divergence from an outbreeding ancestor. Overall, this massive strain resource enables future comparative genetics studies, including genome-wide association study contrasts between Caenorhabditis species.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S57552105", "is_fish": false}, {"id": "10.1371/journal.pgen.1012271", "title": "Genomic constraint and hypervariability correlate with fitness effects in elite tetraploid potato breeding material", "authors": ["Trine Aalborg", "Zihui Ding", "Yaoyao Wu", "Elsa Sverrisdóttir", "Kåre Lehmann Nielsen", "Guillaume P. Ramstein"], "journal": "PLoS Genetics", "date": "2026-08-11", "doi": "10.1371/journal.pgen.1012271", "url": "https://openalex.org/W7202178894", "abstract": "Tetraploid potato is the most important vegetable food crop in the world. However, genetic gains from modern breeding efforts have been limited due to tetrasomic inheritance, the accumulation of deleterious mutations during domestication, and subsequent clonal propagation during modern breeding. In this study, we analyzed previously identified evolutionarily constrained genomic regions in the potato genome relative to a breeding panel of tetraploid potato clones derived from elite cultivars (the MASPOT panel). We demonstrate a significant association between derived allele frequency (DAF) and both positive (constrained) and negative (excess of substitutions relative to neutrality, i.e., hypervariable) nucleotide conservation scores (GERP scores) in the breeding panel, indicating that negative GERP scores can annotate sites affected by positive selection or other non-neutral processes affecting population allele frequency. The deep phylogeny approach can be leveraged to alleviate inbreeding in potatoes through the qualification of causative alleles in tetraploids, offering a valuable resource for potato genetic improvement by molecular breeding. Estimates of genetic load within the tetraploid clones reveal that heterozygous loads vastly exceed homozygous loads for deleterious alleles, consistent with masking of recessive mutations. Deleterious load was significantly correlated with several trait phenotypes but did not improve prediction accuracy of any traits in the tetraploid panel. This could be due to the increased complexity of tetrasomic inheritance, including more effective load complementation, and/or a higher proportion of heterozygosity in tetraploid compared to diploid potato. Intriguingly, the hypervariable load correlated significantly with several phenotypes and improved genomic prediction accuracy of yield by 5% relative to a negative control (permuted loads). This indicates that the inferred hypervariable sites from Solanaceae evolutionary information may contain genetic information relevant for breeding, and that, in contrast to current practice, it is relevant to include and further explore sites with negative GERP scores in general.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S103870658", "is_fish": false}, {"id": "10.7554/elife.106269.3", "title": "Divergent C. elegans toxin alleles are suppressed by distinct mechanisms", "authors": ["Stefan Zdraljevic", "Laura Walter-McNeill", "Giancarlo N. Bruni", "Joshua S. Bloom", "Daniel Leighton", "Jennifer B. Collins", "Heriberto Marquez", "Noah Alexander", "Leonid Kruglyak"], "journal": "eLife", "date": "2026-08-11", "doi": "10.7554/elife.106269.3", "url": "https://openalex.org/W4411673884", "abstract": "Abstract Toxin-antidote elements (TAs) are selfish DNA sequences that bias their transmission to the next generation. TAs typically consist of two linked genes: a toxin and an antidote. The toxin kills progeny that do not inherit the TA, while the antidote counteracts the toxin in progeny that inherit the TA. We previously discovered two TAs in C. elegans that follow the canonical TA model of two linked genes: peel-1/zeel-1 and sup-35/pha-1. Here, we report a new TA that exists in three distinct states across the C. elegans population. The canonical TA, which is found in isolates from the Hawaiian islands, consists of two genes that encode a maternally deposited toxin (MLL-1) and a zygotically expressed antidote (SMLL-1). The toxin induces larval lethality in embryos that do not inherit the antidote gene. A second version of the TA has lost the toxin gene but retains a partially functional antidote. Most C. elegans isolates, including the standard laboratory strain N2, carry a highly divergent allele of the toxin that has retained its activity, but have lost the antidote through pseudogenization. We show that the N2 toxin allele has acquired mutations that enable piRNA binding to initiate MUT-16-dependent 22G small RNA amplification that targets the transcript for degradation. The N2 haplotype represents the first naturally occurring unlinked toxin-antidote system where the toxin is post-transcriptionally suppressed by endogenous small RNA pathways.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S1336409049", "is_fish": false}, {"id": "10.1371/journal.pgen.1012267", "title": "Integrating short-read and long-read single-cell transcriptomics of pig pituitary reveals mechanisms of high-altitude hypoxia adaptation", "authors": ["Hai Li", "Xudong Wu", "Hailong Huo", "Xia Zhang", "Yiming Guo", "Wan Lin", "Feidi Wen", "Zhijun Zhao", "Guiying Zhao", "Jinlong Huo"], "journal": "PLoS Genetics", "date": "2026-08-10", "doi": "10.1371/journal.pgen.1012267", "url": "https://openalex.org/W7202112147", "abstract": "Acting as the central endocrine hub, the pituitary gland is closely related to the mechanism of adaptation to high-altitude hypoxia. Here, by integratively combining long-read (Oxford Nanopore) and short-read (Illumina) single-cell sequencing approaches, we profiled pituitaries from Diqing Tibetan pigs, inhabiting high-altitude environments (3,200 m) and Diannan small-ear pigs from low-altitude regions (500 m), thereby generating a full-length single-cell atlas, which in turn enabled the identification of molecular mechanisms potentially underlying adaptation to high-altitude hypoxia stress. Systematically delineating pituitary structure and transcriptional dynamics, we profiled 27,339 single cells encompassing 28,932 expressed genes. Leveraging unsupervised clustering coupled with marker-based annotation, we identified ten major cell types. Expression profiling of 20 canonical marker genes revealed pronounced cell-type-specific expression patterns, ten of which were independently validated by immunofluorescence, thus substantiating the accuracy of cell-type annotation. Gene-ontology enrichment analysis further suggested that upregulated genes were predominantly involved in oxidative metabolism and energy production, whereas downregulated genes were significantly associated with protein biosynthesis and translation processes, indicating a functional reprogramming of metabolic pathways. Moreover, comparative analyses between breeds and cell-cell communication analyses highlighted pathway shifts, including broad upregulation of the collagen family and four ligand-receptor pairs that may mediate pituitary intercellular coordination. In parallel, transcription-factor activity analysis nominated several regulators, including EBF3, DBX2, and TCF21, which may collectively contribute to altitude-associated adaptation. Finally, integrating long-read sequencing data revealed widespread transcript isoform diversity, with ~28% novel annotations, indicating considerable isoform complexity in pigs. Our findings delineate cellular heterogeneity, inferred intercellular communication networks, and transcript-isoform diversity in the porcine pituitary, thereby providing a cell-resolved resource for understanding pituitary features associated with high-altitude environments.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S103870658", "is_fish": false}, {"id": "10.1038/s41467-026-76200-4", "title": "Biosynthetic mechanism and ecological function of chirality in Solanum steroidal alkaloids", "authors": ["Yang Gao", "Wei Song", "Xuan Zhang", "Wenfeng Ye", "Yibin Lin", "Junyu Ma", "Ying Fu", "Boyang Wang", "Wenxian Lan", "Xiaoyan Xu", "Weijie Huang", "Chen Lin", "Ian T. Baldwin", "José Maurício S. Bento", "Zheyong Xue", "Jiancai Li"], "journal": "Nature Communications", "date": "2026-08-07", "doi": "10.1038/s41467-026-76200-4", "url": "https://openalex.org/W7201862852", "abstract": "Chirality fundamentally influences the bioactivity and ecological roles of plant natural products. Steroidal glycoalkaloids (SGAs) in tomato and wild relatives exhibit this stereochemical variation. Forward genetics identifies C26 hydroxylase GAME8 as the key enzyme controlling SGA chirality. Cultivated tomato harbors two identical GAME8 copies yielding S-configured intermediates, whereas Solanum pennellii homologs GAME8a and GAME8b dominantly produce R- and S-configured products, respectively. Site-saturation mutagenesis and molecular docking reveal four residues sufficient to switch this chirality. Bioassays demonstrate that R-type SGAs, predominant in wild tomato, offer superior defense against the specialist pest Phthorimaea absoluta, although chirality does not affect resistance to the generalist Spodoptera litura. Collectively, these results elucidate the biosynthetic mechanism and ecological significance of SGA chirality, establishing a basis for tailoring phytochemical stereochemistry to enhance crop protection. Authors investigate the biosynthetic mechanism of steroidal glycoalkaloid (SGA) chirality in Solanum species. GAME8 enzymes are found to catalyze the biosynthesis of R- and S-configured SGAs, which contribute to variations in defense against pests.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1093/sysbio/syag001", "title": "A Genomic Perspective on Cryptic Species Reveals Complex Evolutionary Dynamics in the Gray Zone of the Speciation Continuum.", "authors": ["Chan KO", "Neokleous DN", "Anuar S", "Brown RM", "Hutter CR", "Das I", "Hertwig ST"], "journal": "Systematic biology", "date": "2026-08-06", "doi": "10.1093/sysbio/syag001", "url": "https://pubmed.ncbi.nlm.nih.gov/41533667/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S65478581", "is_fish": false}, {"id": "10.1038/s41467-026-76204-0", "title": "Archaic ancestry inference in imputed ancient human genomes", "authors": ["Marco Rosario Capodiferro", "Léo Planche", "Emily M. Breslin", "Linda Ongaro", "María C. Ávila‐Arcos", "Flora Jay", "Lara M. Cassidy", "Emilia Huerta‐Sánchez"], "journal": "Nature Communications", "date": "2026-08-06", "doi": "10.1038/s41467-026-76204-0", "url": "https://openalex.org/W4412619853", "abstract": "Abstract When modern humans expanded from Africa into Eurasia, they interbred with archaic hominins such as Neanderthals and Denisovans. This groundbreaking discovery, made in part possible through the genomic analysis of archaic remains, reshaped our understanding of human origins, and opened new research avenues to study the effects and consequences of archaic introgression. While significant progress has been made in identifying and quantifying archaic introgression, most studies have focused on contemporary individual genomic data. As a result, relatively little is known about the evolution of archaic variants within modern human populations shortly after interbreeding occurred. While analysis of ancient DNA from modern humans offers the potential to address this scientific gap, its poor quality has hindered its exploration. However, recent studies have shown that imputation using contemporary reference panels can accurately infer missing genotypes in ancient genomes. Here, we investigate the feasibility of using imputation to improve both global and local archaic ancestry inference in ancient genomes, by downsampling to different low-coverage values and imputing 20 high-coverage (&gt;10X) ancient genomes, representing individuals from diverse temporal and geographical contexts. We tested the reliability of detecting and quantifying archaic introgression using D-statistics and the f4-ratio . We identified consistent results from the imputed and the original ancient genomes, suggesting that genomic estimates to detect and quantify introgression work well in imputed genomes. Regarding Local Ancestry Inference we find that we can identify more introgressed segments in imputed genomes than in non-imputed genomes. Surprisingly, we find that imputation accuracy is even higher in regions of archaic ancestry compared to other regions of the genome, facilitating the detection of introgressed segments in imputed genomes. Imputation also allows detection of Denisovan segments in Siberian and Alaskan individuals. We show that segments identified even at 0.0625X coverage can be used to reconstruct the history of introgressed haplotypes. For example, comparisons with archaic segments in contemporary humans reveal that the oldest individual analyzed, Ust’Ishim, carried segments that are now found exclusively in either European or East Eurasian populations, indicating that these segments co-occurred in a shared ancestral population. By comparing only ancient individuals, we demonstrate that clustering based solely on the identified archaic segments effectively groups individuals into genetic clusters that correspond to populations defined by geography and time. This analysis shows a clear distinction between individuals with Denisovan introgression and those without, as well as a more detailed separation between Mesolithic and Neolithic Europeans, with the latter closely resembling Central Eurasian individuals. Furthermore, despite the small sample size in this study, we are able to reconstruct the origins of genes identified as candidates for adaptive introgression in contemporary populations, such as the BCN2 gene, which is an adaptively introgressed gene identified in contemporary West Eurasians. Additionally, we identify new candidates for adaptive introgression including LEMD2 and MLN in Europe. In this gene-region, imputation helps resolve the introgressed haplotype, which is closest to the Vindija Neanderthal haplotype.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1038/s41467-026-75288-y", "title": "Identification of carnivory in the flowering plant Saxifraga via multidisciplinary evidence", "authors": ["Xinjian Zhang", "Tao Deng", "Nan Lin", "Hengchang Wang", "Bo Song", "Erna Xun", "Xianhan Huang", "Quansheng Fu", "Jun‐Tong Chen", "Peng‐Rui Luo", "Douglas E. Soltis", "Hang Sun"], "journal": "Nature Communications", "date": "2026-08-04", "doi": "10.1038/s41467-026-75288-y", "url": "https://openalex.org/W7172452468", "abstract": "Abstract The transformation from prey to predator is a striking adaptive innovation shared by all carnivorous plants, which capture and digest diverse animal prey for nutrients (nitrogen, N). Here, we report carnivory in the alpine flowering plant Saxifraga candelabrum (Saxifragaceae; Saxifragales). Field experiments and herbarium surveys reveal that this plant actively attracts and captures insect prey via glandular hairs. Enzymatic analyses further confirm the ability of plants to digest prey, and isotope labelling experiments using ¹⁵N-labelled insects demonstrate the transfer of nitrogen from prey to plant tissues, thus verifying the presence of carnivory. Genomic comparisons reveal a significant genome-wide convergence in genes related to carnivory (e.g., leaf morphogenesis, digestion and nutrition) across six independent origins of carnivory in diverse flowering plant lineages. Our findings provide definitive evidence of carnivory in Saxifraga , addressing Charles Darwin’s long-standing hypothesis that some Saxifraga species may be capable of carnivory, and further suggest that carnivory may be more widespread among angiosperms than previously recognized.", "track": "B", "source": "OpenAlex", "journal_h_index": null, "journal_citedness": null, "tier": 1, "openalex_source_id": "S64187185", "is_fish": false}, {"id": "10.1038/s41467-026-76213-z", "title": "Polymorphism can extensively reshape the genome-wide crossover landscape in Arabidopsis thaliana", "authors": ["Benoît Madec", "Maëla Sémery", "Qichao Lian", "Mohamad Yassine", "Loïse Leonard-Moniot", "Eric Espagne", "Sophie J. M. Piquerez", "Chloé Girard"], "journal": "Nature Communications", "date": "2026-08-01", "doi": "10.1038/s41467-026-76213-z", "url": "https://openalex.org/W4416877090", "abstract": "Abstract Meiotic recombination, via the formation of crossovers (COs), re-assorts parental alleles and dictate which traits are inherited together, or not. The recombination rate is not homogeneous across the genome, and uncovering the causes of these fluctuations can inform our understanding of DNA recombination and genome evolution. In this study we show that presence of sequence divergence (polymorphism) between homologous chromosomes increases the local recombination rate in Arabidopsis thaliana . This effect is observed genome-wide, turning cold regions of the genome hot. This relocation of COs towards polymorphic regions occurs at the expense of non-polymorphic ones, which become colder. This global overhaul of the CO landscape is dependent on the mismatch repair (MMR) machinery. This suggests that MMR has a pro-CO role, driving COs to regions of the genome where it cou ecific expansions in herbicide-associated gene families. Extensive sympatric introgression is observed within Digitaria, correlated with environmental selection. Through dose-response assay of 196 accessions, we identify 19 candidate genes associated with herbicide resistance, including DsSOH1. Haplotype analysis indicates that the resistant allele at DsSOH1 locus originated from D. ciliaris, suggesting a possible evolutionary contribution of introgression to the distribution of resistance-associated alleles. Together, our findings provide genomic insights into the evolutionary success of D. sanguinalis and offer resources for studying polyploid evolution and environmental adaptation as well as precision weed management in agroecosystems. Crabgrasses (Digitaria spp.) are invasive upland weeds distributed globally. Here, the authors assemble a telomere-to-telomere reference genome of D. sanguinalis along with its diploid and tetraploid progenitors and reveal lineage-specific introgression of a herbicide resistance-associated gene through population genetics analyses.", "track": "B", "source": "OpenAlex", "openalex_source_id": "S64187185", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syag012", "title": "Synergizing Bayesian and Heuristic Approaches: D-BPP Uncovers Ghost Introgression in Panthera and Thuja.", "authors": ["Yang Y", "Pang XX", "Ding YM", "Zhang BW", "Bai WN", "Zhang DY"], "journal": "Systematic biology", "date": "2026-02-05", "doi": "10.1093/sysbio/syag012", "url": "https://pubmed.ncbi.nlm.nih.gov/41642269/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S65478581", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1016/j.ympev.2025.108500", "title": "Multiple origins, singular success: genomic evidence for past recurrent hybridization in Chenopodium album s. str. (Amaranthacea e.89815", "title": "Archaic introgression contributed to shape the adaptive modulation of angiogenesis and cardiovascular traits in human high-altitude populations from the Himalayas.", "authors": ["Ferraretti G", "Abondio P", "Alberti M", "Dezi A", "Sherpa PT", "Cocco P", "Tiriticco M", "Di Marcello M", "Gnecchi-Ruscone GA", "Natali L", "Corcelli A", "Marinelli G", "Peluzzi D", "Sarno S", "Sazzini M"], "journal": "eLife", "date": "2024-11-08", "doi": "10.7554/elife.89815", "url": "https://pubmed.ncbi.nlm.nih.gov/39513938/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S1336409049", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/sysbio/syae024", "title": "Benefits and Limits of Phasing Alleles for Network Inference of Allopolyploid Complexes.", "authors": ["Tiley GP", "Crowl AA", "Manos PS", "Sessa EB", "Solís-Lemus C", "Yoder AD", "Burleigh JG"], "journal": "Systematic biology", "date": "2024-10-25", "doi": "10.1093/sysbio/syae024", "url": "https://pubmed.ncbi.nlm.nih.gov/38733563/", "abstract": "", "track": "B", "source": "PubMed", "openalex_source_id": "S65478581", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/bioinformatics/btae642", "title": "Detection and quantification of introgression using Bayesian inference based on conjugate priors", "authors": ["Bastian Pfeifer", "Durrell D. Kapan", "Sereina A. Herzog"], "journal": "Bioinformatics", "date": "2024-10-23", "doi": "10.1093/bioinformatics/btae642", "url": "https://openalex.org/W4403785129", "abstract": "SUMMARY: Introgression (the flow of genes between species) is a major force structuring the evolution of genomes, potentially providing raw material for adaptation. Here, we present a versatile Bayesian model selection approach for detecting and quantifying introgression, df-BF, that builds upon the recently published distance-based df statistic. Unlike df, df-BF accounts for the number of variant sites within a genomic region. The underlying model parameter of our df-BF method, here denoted as dfθ, accurately quantifies introgression, and the corresponding Bayes Factors (df-BF) enables weighing the strength of evidence for introgression. To ensure fast computation, we use conjugate priors with no need for computationally demanding MCMC iterations. We compare our method with other approaches including df, fd, Dp, and Patterson's D using a wide range of coalescent simulations. Furthermore, we showcase the applicability of df-BF and dfθ using whole-genome mosquito data. Finally, we integrate the new method into the powerful genomics R-package PopGenome. AVAILABILITY AND IMPLEMENTATION: The presented methods are implemented within the R-package PopGenome (https://github.com/pievos101/PopGenome) and the simulation as the application results can be reproduced from the source code available from a dedicated GitHub repository (https://github.com/pievos101/Introgression-Simulation).", "track": "B", "source": "OpenAlex", "openalex_source_id": "S52395412", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1111/mec.17515", "title": "Towards the conservation of the crucian carp in Europe: Prolific hybridization but no evidence for introgression between native and non-native taxa.", "authors": ["Jeffries DL", "Lawson-Handley L", "Lamatsch DK", "Olsén KH", "Sayer CD", "Hänfling B"], "journal": "Molecular ecology", "date": "2024-10-01", "doi": "10.1111/mec.17515", "url": "https://pubmed.ncbi.nlm.nih.gov/39212263/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": true, "tier": 1, "openalex_source_id": "S22454499"}, {"id": "10.1093/molbev/msae198", "title": "Five-leaf Generalizations of the D-statistic Reveal the Directionality of Admixture", "authors": ["Kalle Leppälä", "Flavio Augusto da Silva Coelho", "Michaela Richter", "Victor A. Albert", "Charlotte Lindqvist"], "journal": "Molecular Biology and Evolution", "date": "2024-09-20", "doi": "10.1093/molbev/msae198", "url": "https://openalex.org/W4402665246", "abstract": "Over the past 15 years, the D-statistic, a four-taxon test for organismal admixture (hybridization, or introgression) which incorporates single nucleotide polymorphism data with allelic patterns ABBA and BABA, has seen considerable use. This statistic seeks to discern significant deviation from either a given species tree assumption, or from the balanced incomplete lineage sorting that could otherwise defy this species tree. However, while the D-statistic can successfully discriminate admixture from incomplete lineage sorting, it is not a simple matter to determine the directionality of admixture using only four-leaf tree models. As such, methods have been developed that use five leaves to evaluate admixture. Among these, the DFOIL method (\"FOIL\", a mnemonic for \"First-Outer-Inner-Last\"), which tests allelic patterns on the \"symmetric\" tree S=(((1,2),(3,4)),5), succeeds in finding admixture direction for many five-taxon examples. However, DFOIL does not make full use of all symmetry, nor can DFOIL function properly when ancient samples are included because of the reliance on singleton patterns (such as BAAAA and ABAAA). Here, we take inspiration from DFOIL to develop a new and completely general family of five-leaf admixture tests, dubbed Δ-statistics, that can either incorporate or exclude the singleton allelic patterns depending on individual taxon and age sampling choices. We describe two new shapes that are also fully testable, namely the \"asymmetric\" tree A=((((1,2),3),4),5) and the \"quasisymmetric\" tree Q=(((1,2),3),(4,5)), which can considerably supplement the \"symmetric\" S=(((1,2),(3,4)),5) model used by DFOIL. We demonstrate the consistency of Δ-statistics under various simulated scenarios, and provide empirical examples using data from black, brown and polar bears, the latter also including two ancient polar bear samples from previous studies. Recently, DFOIL and one of these ancient samples was used to argue for a dominant polar bear → brown bear introgression direction. However, we find, using both this ancient polar bear and our own, that by far the strongest signal using both DFOIL and Δ-statistics on tree S is actually bidirectional gene flow of indistinguishable direction. Further experiments on trees A and Q instead highlight what were likely two phases of admixture: one with stronger brown bear → polar bear introgression in ancient times, and a more recent phase with predominant polar bear → brown bear directionality.", "track": "B", "source": "OpenAlex", "openalex_source_id": "S57552105", "source_type": "journal", "source_is_core": true, "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1}, {"id": "10.1093/plcell/koae202", "title": "Transcriptomic response to nitrogen availability reveals signatures of adaptive plasticity during tetraploid wheat domestication.", "authors": ["Pieri A", "Beleggia R", "Gioia T", "Tong H", "Di Vittori V", "Frascarelli G", "Bitocchi E", "Nanni L", "Bellucci E", "Fiorani F", "Pecchioni N", "Marzario S", "De Quattro C", "Limongi AR", "De Vita P", "Rossato M", "Schurr U", "David JL", "Nikoloski Z", "Papa R"], "journal": "The Plant cell", "date": "2024-09-03", "doi": "10.1093/plcell/koae202", "url": "https://pubmed.ncbi.nlm.nih.gov/39056474/", "abstract": "", "track": "B", "source": "PubMed", "journal_h_index": null, "journal_citedness": null, "is_fish": false, "tier": 1, "openalex_source_id": "S48849333"}, {"id": "10.1038/s41467-024-52041-x", "title": "Asexuality shapes traits in a hybrid fish.", "authors": ["Lafond J", "Leung C", "Angers B"], "journal": "Nature communications", "date": "2024-09-02", "doi": "10.1038/s41467-024-52041-x", "url": "https://pubmed.ncbi.nlm.nih.gov/39223116/", "abstract": "", "track": "B", "source
