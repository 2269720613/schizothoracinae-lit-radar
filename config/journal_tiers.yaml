# 期刊分级配置
# Tier 1：命中下方白名单（display_name 小写归一化匹配，含常见变体）
# Tier 2：未命中白名单，但 OpenAlex Sources 指标达标（type=journal + is_core + 阈值）
# Tier 3：有正规期刊名但未达 Tier 2
# Tier 0：命中噪声词 / 无期刊来源 / 非论文类型（看板默认隐藏）
#
# 想加经典期刊：直接往对应 track 列表追加一行小写刊名即可，无需改代码。

whitelist:
  track_a:
    - "molecular ecology"
    - "molecular ecology resources"
    - "molecular phylogenetics and evolution"
    - "systematic biology"
    - "systematic biology and biodiversity"
    - "evolution"
