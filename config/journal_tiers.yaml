# Tier 2 自动判据（来自 OpenAlex Sources API summary_stats，二者满足其一即可）
thresholds:
  min_h_index: 120
  min_2yr_mean_citedness: 4.0

# 标题命中以下片段（小写包含匹配）→ 直接降级为噪声（tier 0）
noise_title_patterns:
  - "occurrence download"
  - "occurrence dataset"
  - "gbif"
  - "data descriptor"
  - "dataset protocol"
  - "checklist of the"
  - "red list of"
  - "fauna of"
  - "flora of"
  - "new record of"
  - "first record of"
  - "catalogue of life"
  - "biodiversity data"
  - "kernel density dataset"
  - "version 1.0"
  - "a new species described"
