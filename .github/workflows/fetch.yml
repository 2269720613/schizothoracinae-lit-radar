name: Fetch literature daily

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC ≈ 北京时间 14:00
  workflow_dispatch:
    inputs:
      backfill:
        description: "近五年回填(5 年窗口,每关键词上限 1000 篇)"
        type: boolean
        default: false

concurrency:
  group: fetch-literature
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/fetch.py ${{ inputs.backfill && '--backfill' || '' }}
      - run: python3 scripts/inject.py
      - name: Commit updated data + rendered site
        run: |
          git config user.name "lit-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json dist/dashboard.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update literature $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/inject.py
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp dist/dashboard.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
