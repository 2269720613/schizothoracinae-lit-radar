              "abstract": "Schizothoracinae (teleost fish) inhabit the Qinghai-Tibetan Plateau and provide an exceptional model for studying extreme environment adaptation. Here we sequenced 120 high-coverage genomes across 15 species from major river basins. Phylogenomic analysis resolved long-standing taxonomic controversies and pinpointed specific gene duplications in hypoxia response pathways."
            },
            {
              "title": "High-altitude hypoxia adaptation mechanisms in Gymnocypris przewalskii based on single-cell transcriptome",
              "authors": ["Liu, H.", "Zhao, K.", "Yang, L."],
              "journal": "bioRxiv",
              "date": "2026-07-29",
              "source": "bioRxiv",
              "doi": "10.1101/2026.07.29.589012",
              "url": "https://biorxiv.org/content/10.1101/2026.07.29.589012",
              "abstract": "Gymnocypris przewalskii is an iconic endemic Schizothoracinae fish in Qinghai Lake. Single-cell RNA sequencing of gill filaments and heart tissue revealed specialized cell clusters involved in ion regulation under high alkalinity and low oxygen conditions."
            },
            {
              "title": "Phylogenomic insights into the adaptive radiation of Schizopygopsis pylzovi in the Yellow River basin",
              "authors": ["Sun, G.", "Ma, R.", "He, S."],
              "journal": "Systematic Biology",
              "date": "2026-07-15",
              "source": "PubMed",
              "doi": "10.1093/sysbio/syab045",
              "url": "https://pubmed.ncbi.nlm.nih.gov/38901234/",
              "abstract": "Target capture sequencing was applied to investigate genomic divergence and historical population dynamics of Schizopygopsis pylzovi. Results suggest rapid adaptive radiation following the uplift of the northeastern Tibetan Plateau during the late Pleistocene."
            }
          ]
        },
        "B": {
          "label": "群体遗传方法学前沿",
          "keywords": ["Demographic History", "dadi", "fsc28", "SFS", "Polyploid Dosage"],
          "papers": [
            {
              "title": "Inferring complex demographic histories in autopolyploid populations using dosage-encoded SFS",
              "authors": ["Gautier, M.", "Vitalis, R.", "Rousset, F."],
              "journal": "Genetics",
              "date": "2026-08-01",
              "source": "OpenAlex",
              "doi": "10.1093/genetics/iyad120",
              "url": "https://doi.org/10.1093/genetics/iyad120",
              "abstract": "Polyploid allele dosage information is frequently lost when converting VCFs to diploid representations. We introduce a novel site frequency spectrum (SFS) inference framework that directly accepts dosage-encoded polyploid data, preventing artificial inflation of low-frequency allele estimates."
            },
            {
              "title": "Fast and accurate simulation of multi-locus polyploid allele frequency spectra under selection",
              "authors": ["Chen, Y.", "Excoffier, L."],
              "journal": "Bioinformatics",
              "date": "2026-07-20",
              "source": "PubMed",
              "doi": "10.1093/bioinformatics/btad345",
              "url": "https://pubmed.ncbi.nlm.nih.gov/38812345/",
              "abstract": "We present an upgraded coalescent simulator capable of modeling selection and gene flow in polyploid demographic networks. Extensive benchmark tests demonstrate superior speed and memory efficiency compared to existing tools."
            },
            {
              "title": "Deep learning models for continuous spatial demographic inference from low-coverage sequencing data",
              "authors": ["Wang, C.", "Nielsen, R."],
              "journal": "bioRxiv",
              "date": "2026-07-10",
              "source": "bioRxiv",
              "doi": "10.1101/2026.07.10.456789",
              "url": "https://biorxiv.org/content/10.1101/2026.07.10.456789",
              "abstract": "Spatial population genetics has traditionally relied on simplified island models. Here we present a convolutional neural network architecture for continuous spatial demography estimation directly from genotype likelihoods."
            }
          ]
        }
      },
      "stats": {
        "total_count": 6,
        "new_this_week": 2,
        "weekly_trend": [
          {"week": "2026-W27", "count": 1},
          {"week": "2026-W28", "count": 1},
          {"week": "2026-W29", "count": 2},
          {"week": "2026-W30", "count": 0},
          {"week": "2026-W31", "count": 2}
        ]
      }
    };
  }

  let radarData;
  const scriptElem = document.getElementById('lit-radar-data');
  if (scriptElem) {
    const rawText = scriptElem.textContent.trim();
    if (rawText === '__LIT_RADAR_DATA__' || !rawText) {
      radarData = getMockData();
    } else {
      try {
        radarData = JSON.parse(rawText);
      } catch (e) {
        radarData = getMockData();
      }
    }
  } else {
    radarData = getMockData();
  }

  let currentTrackKey = 'ALL';
  let searchQuery = '';
  let selectedSources = new Set();
  let expandedPaperIds = new Set();

  const allPapers = [];
  const sourceSet = new Set();

  if (radarData.tracks) {
    Object.keys(radarData.tracks).forEach(key => {
      const track = radarData.tracks[key];
      if (track.papers && Array.isArray(track.papers)) {
        track.papers.forEach((paper, idx) => {
          paper._trackKey = key;
          paper._trackLabel = track.label;
          paper._id = `${key}_${idx}_${paper.title}`;
          allPapers.push(paper);
          if (paper.source) {
            sourceSet.add(paper.source);
          }
        });
      }
    });
  }

  sourceSet.forEach(s => selectedSources.add(s));

  const genAtDate = radarData.generated_at ? new Date(radarData.generated_at) : new Date();
  const sevenDaysAgoMs = genAtDate.getTime() - (7 * 86400000);

  function isPaperNew(paperDateStr) {
    if (!paperDateStr) return false;
    const pDate = new Date(paperDateStr);
    return pDate.getTime() >= sevenDaysAgoMs;
  }

  function formatChineseDate(isoStr) {
    if (!isoStr) return '';
    try {
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch (e) {
      return isoStr;
    }
  }

  function initHeader() {
    const timeElem = document.getElementById('header-time');
    if (timeElem) timeElem.textContent = formatChineseDate(radarData.generated_at || '');

    const totalValElem = document.getElementById('total-count-val');
    if (totalValElem) totalValElem.textContent = radarData.stats?.total_count ?? allPapers.length;

    const newValElem = document.getElementById('new-count-val');
    if (newValElem) newValElem.textContent = radarData.stats?.new_this_week ?? allPapers.filter(p => isPaperNew(p.date)).length;

    renderWeeklyChart();
  }

  function renderWeeklyChart() {
    const trend = radarData.stats?.weekly_trend || [];
    const container = document.getElementById('weekly-chart-container');
    if (!container || !trend.length) {
      if (container) container.style.display = 'none';
      return;
    }

    const svgWidth = Math.max(400, trend.length * 70);
    const svgHeight = 130;
    const topMargin = 25;
    const bottomMargin = 30;
    const leftMargin = 30;
    const rightMargin = 30;
    const chartHeight = svgHeight - topMargin - bottomMargin;
    const availableWidth = svgWidth - leftMargin - rightMargin;
    const barStep = availableWidth / trend.length;
    const barWidth = Math.min(36, barStep * 0.55);

    const maxCount = Math.max(1, ...trend.map(t => t.count));

    let barsHTML = '';
    trend.forEach((item, idx) => {
      const x = leftMargin + idx * barStep + (barStep - barWidth) / 2;
      const heightVal = Math.round((item.count / maxCount) * chartHeight);
      const barH = item.count > 0 ? Math.max(4, heightVal) : 2;
      const y = topMargin + chartHeight - barH;

      barsHTML += `
        <g class="bar-group">
          <rect class="chart-bar" x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="4" ry="4" fill="url(#barGrad)">
            <title>${item.week}: ${item.count} 篇</title>
          </rect>
          <text x="${x + barWidth / 2}" y="${y - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary)">${item.count}</text>
          <text x="${x + barWidth / 2}" y="${svgHeight - 8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${item.week}</text>
        </g>
      `;
    });

    const svgHTML = `
      <svg class="chart-svg" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="xMinYMin meet">
        <defs>
          <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent-color)" />
            <stop offset="100%" stop-color="var(--accent-hover)" stop-opacity="0.8" />
          </linearGradient>
        </defs>
        ${barsHTML}
      </svg>
    `;

    container.innerHTML = svgHTML;
  }

  function initTabs() {
    const tabsContainer = document.getElementById('tracks-tabs');
    if (!tabsContainer) return;

    let html = `<button class="tab-btn active" data-track="ALL">全部文献</button>`;

    if (radarData.tracks) {
      Object.keys(radarData.tracks).forEach(key => {
        const t = radarData.tracks[key];
        html += `<button class="tab-btn" data-track="${key}">${t.label || key}</button>`;
      });
    }

    tabsContainer.innerHTML = html;

    tabsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;

      tabsContainer.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTrackKey = btn.dataset.track;
      renderPapers();
    });
  }

  function initSourceFilters() {
    const sourceContainer = document.getElementById('source-pills-container');
    if (!sourceContainer) return;

    let html = '';
    const sortedSources = Array.from(sourceSet).sort();
    sortedSources.forEach(s => {
      html += `<div class="source-pill active" data-source="${s}">${s}</div>`;
    });

    sourceContainer.innerHTML = html;

    sourceContainer.addEventListener('click', (e) => {
      const pill = e.target.closest('.source-pill');
      if (!pill) return;

      const src = pill.dataset.source;
      if (selectedSources.has(src)) {
        selectedSources.delete(src);
        pill.classList.remove('active');
      } else {
        selectedSources.add(src);
        pill.classList.add('active');
      }
      renderPapers();
    });

    const toggleAllBtn = document.getElementById('toggle-sources-btn');
    if (toggleAllBtn) {
      toggleAllBtn.addEventListener('click', () => {
        if (selectedSources.size === sourceSet.size) {
          selectedSources.clear();
          sourceContainer.querySelectorAll('.source-pill').forEach(p => p.classList.remove('active'));
          toggleAllBtn.textContent = '全选';
        } else {
          sourceSet.forEach(s => selectedSources.add(s));
          sourceContainer.querySelectorAll('.source-pill').forEach(p => p.classList.add('active'));
          toggleAllBtn.textContent = '清空';
        }
        renderPapers();
      });
    }
  }

  function initSearch() {
    const searchInput = document.getElementById('search-input');
    if (!searchInput) return;

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderPapers();
    });
  }

  function renderPapers() {
    const paperListElem = document.getElementById('paper-list');
    const papersCountElem = document.getElementById('filtered-count');
    if (!paperListElem) return;

    let filtered = allPapers.filter(paper => {
      if (currentTrackKey !== 'ALL' && paper._trackKey !== currentTrackKey) {
        return false;
      }
      if (paper.source && !selectedSources.has(paper.source)) {
        return false;
      }
      if (searchQuery) {
        const titleMatch = (paper.title || '').toLowerCase().includes(searchQuery);
        const abstractMatch = (paper.abstract || '').toLowerCase().includes(searchQuery);
        const authorMatch = (paper.authors || []).some(a => a.toLowerCase().includes(searchQuery));
        if (!titleMatch && !abstractMatch && !authorMatch) {
          return false;
        }
      }
      return true;
    });

    filtered.sort((a, b) => {
      const dateA = a.date ? new Date(a.date).getTime() : 0;
      const dateB = b.date ? new Date(b.date).getTime() : 0;
      return dateB - dateA;
    });

    if (papersCountElem) {
      papersCountElem.textContent = `显示 ${filtered.length} / 共 ${allPapers.length} 篇文献`;
    }

    if (filtered.length === 0) {
      paperListElem.innerHTML = `
        <div class="empty-state">
          <p>未找到符合条件的文献</p>
        </div>
      `;
      return;
    }

    let html = '';
    filtered.forEach((paper) => {
      const isNew = isPaperNew(paper.date);
      const isExpanded = expandedPaperIds.has(paper._id);

      let authorsStr = '';
      if (paper.authors && Array.isArray(paper.authors) && paper.authors.length > 0) {
        if (paper.authors.length > 3) {
          authorsStr = paper.authors.slice(0, 3).join(', ') + ' 等';
        } else {
          authorsStr = paper.authors.join(', ');
        }
      }

      const paperUrl = paper.url || (paper.doi ? `https://doi.org/${paper.doi}` : null);

      html += `
        <div class="paper-card" data-id="${paper._id}">
          <div class="paper-title-row">
            <h3 class="paper-title" onclick="toggleAbstract('${paper._id}')">${paper.title || '无标题'}</h3>
            ${paperUrl ? `
              <a href="${paperUrl}" target="_blank" rel="noopener noreferrer" class="paper-link-btn" title="查看原文/DOI" onclick="event.stopPropagation()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            ` : ''}
          </div>

          <div class="paper-meta-row">
            ${isNew ? `<span class="badge badge-new">NEW</span>` : ''}
            ${paper.source ? `<span class="badge badge-source" data-source="${paper.source}">${paper.source}</span>` : ''}
            <span class="paper-date">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${paper.date || '无日期'}
            </span>
            ${paper._trackLabel ? `<span class="paper-date" style="opacity:0.8;">[${paper._trackLabel}]</span>` : ''}
          </div>

          ${authorsStr ? `<div class="paper-authors">作者：${authorsStr}</div>` : ''}
          ${paper.journal ? `<div class="paper-journal">期刊：${paper.journal}</div>` : ''}

          ${paper.abstract ? `
            <button class="abstract-toggle-btn ${isExpanded ? 'expanded' : ''}" onclick="toggleAbstract('${paper._id}')">
              ${isExpanded ? '收起摘要' : '查看摘要'}
              <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="abstract-box ${isExpanded ? 'expanded' : ''}" id="abstract-${paper._id}">
              ${paper.abstract}
            </div>
          ` : ''}
        </div>
      `;
    });

    paperListElem.innerHTML = html;
  }

  window.toggleAbstract = function(id) {
    if (expandedPaperIds.has(id)) {
      expandedPaperIds.delete(id);
    } else {
      expandedPaperIds.add(id);
    }
    renderPapers();
  };

  function initTheme() {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;

    btn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      let nextTheme;
      if (!currentTheme) {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        nextTheme = isDark ? 'light' : 'dark';
      } else {
        nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', nextTheme);
    });
  }

  function startApp() {
    initHeader();
    initTabs();
    initSourceFilters();
    initSearch();
    initTheme();
    renderPapers();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startApp);
  } else {
    startApp();
  }
})();
</script>
