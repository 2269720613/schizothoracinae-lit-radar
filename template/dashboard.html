    renderPaperList();
  }

  function loadData() {
    const rawDataElem = document.getElementById('lit-radar-data');
    let parsed = null;
    if (rawDataElem && rawDataElem.textContent) {
      const txt = rawDataElem.textContent.trim();
      if (txt !== '__LIT_RADAR_DATA__') {
        try {
          parsed = JSON.parse(txt);
        } catch (e) {
          console.warn("Failed to parse #lit-radar-data, falling back to mock data.", e);
        }
      }
    }
    appState.data = parsed || MOCK_DATA;

    // Flatten all papers
    appState.allPapers = [];
    if (appState.data.tracks) {
      Object.keys(appState.data.tracks).forEach(trackKey => {
        const track = appState.data.tracks[trackKey];
        if (track.papers) {
          track.papers.forEach(p => {
            appState.allPapers.push({
              ...p,
              trackKey: trackKey,
              trackLabel: track.label || trackKey
            });
          });
        }
      });
    }
  }

  /* Theme System */
  function initTheme() {
    const savedTheme = localStorage.getItem('lit_radar_theme') || 'auto';
    setTheme(savedTheme);
  }

  function toggleTheme() {
    const modes = ['auto', 'dark', 'light'];
    const nextIdx = (modes.indexOf(appState.currentTheme) + 1) % modes.length;
    const nextTheme = modes[nextIdx];
    setTheme(nextTheme);
    localStorage.setItem('lit_radar_theme', nextTheme);
  }

  function setTheme(theme) {
    appState.currentTheme = theme;
    const root = document.documentElement;
    const iconElem = document.getElementById('theme-icon');
    const textElem = document.getElementById('theme-text');

    if (theme === 'auto') {
      root.removeAttribute('data-theme');
      iconElem.textContent = '🌗';
      textElem.textContent = '自动主题';
    } else if (theme === 'dark') {
      root.setAttribute('data-theme', 'dark');
      iconElem.textContent = '🌙';
      textElem.textContent = '深色模式';
    } else {
      root.setAttribute('data-theme', 'light');
      iconElem.textContent = '☀️';
      textElem.textContent = '浅色模式';
    }
  }

  /* Header & Stats */
  function renderHeader() {
    const data = appState.data;
    const genTimeElem = document.getElementById('gen-time');
    if (data.generated_at) {
      const dt = new Date(data.generated_at);
      genTimeElem.textContent = isNaN(dt.getTime()) ? data.generated_at : dt.toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }

    const totalCount = data.stats && data.stats.total_count !== undefined ? data.stats.total_count : appState.allPapers.length;
    const newCount = data.stats && data.stats.new_this_week !== undefined ? data.stats.new_this_week : appState.allPapers.filter(p => p.is_new).length;

    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-new').textContent = newCount;
  }

  /* SVG Chart */
  function renderWeeklyChart() {
    const svg = document.getElementById('weekly-chart');
    const trend = (appState.data.stats && appState.data.stats.weekly_trend) || [];
    if (!trend || trend.length === 0) return;

    const width = 600;
    const height = 140;
    const padding = { top: 25, bottom: 30, left: 40, right: 40 };

    const counts = trend.map(t => t.count);
    const maxVal = Math.max(...counts, 5);

    const stepX = (width - padding.left - padding.right) / (trend.length - 1 || 1);
    const points = trend.map((t, idx) => {
      const x = padding.left + idx * stepX;
      const y = height - padding.bottom - (t.count / maxVal) * (height - padding.top - padding.bottom);
      return { x, y, val: t.count, label: t.week };
    });

    let pathD = `M ${points[0].x} ${points[0].y}`;
    points.forEach((p, i) => {
      if (i > 0) pathD += ` L ${p.x} ${p.y}`;
    });

    const areaD = `${pathD} L ${points[points.length - 1].x} ${height - padding.bottom} L ${points[0].x} ${height - padding.bottom} Z`;

    let html = `
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="var(--border-color)" stroke-width="1"/>
      <path d="${areaD}" fill="url(#chartGrad)" />
      <path d="${pathD}" fill="none" stroke="var(--accent-primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    `;

    points.forEach(p => {
      html += `
        <rect x="${p.x - 18}" y="${p.y - 18}" width="36" height="14" rx="4" fill="var(--bg-card)" stroke="var(--border-color)" stroke-width="1"/>
        <text x="${p.x}" y="${p.y - 8}" fill="var(--accent-primary)" font-size="10" font-weight="bold" text-anchor="middle">${p.val}</text>
        <circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent-primary)" stroke="var(--bg-card)" stroke-width="2"/>
        <text x="${p.x}" y="${height - 10}" fill="var(--text-muted)" font-size="11" text-anchor="middle">${p.label}</text>
      `;
    });

    svg.innerHTML = html;
  }

  /* Filters */
  function renderFilterControls() {
    // Tracks Tabs
    const trackTabsContainer = document.getElementById('track-tabs');
    const tracks = appState.data.tracks || {};
    let trackHtml = `
      <button class="tab-btn ${appState.activeTrack === 'all' ? 'active' : ''}" onclick="selectTrack('all')">
        全部 (${appState.allPapers.length})
      </button>
    `;

    Object.keys(tracks).forEach(key => {
      const track = tracks[key];
      const count = (track.papers || []).length;
      trackHtml += `
        <button class="tab-btn ${appState.activeTrack === key ? 'active' : ''}" onclick="selectTrack('${key}')">
          ${escapeHtml(track.label || key)} (${count})
        </button>
      `;
    });
    trackTabsContainer.innerHTML = trackHtml;

    // Sources Pills
    const sourceFiltersContainer = document.getElementById('source-filters');
    const sourcesSet = new Set(appState.allPapers.map(p => p.source || 'Other'));
    let sourceHtml = `
      <button class="source-pill ${appState.activeSource === 'all' ? 'active' : ''}" data-source="all" onclick="selectSource('all')">
        全部 Source
      </button>
    `;

    sourcesSet.forEach(src => {
      const srcCategory = getSourceCategory(src);
      sourceHtml += `
        <button class="source-pill ${appState.activeSource === src ? 'active' : ''}" data-source="${srcCategory}" onclick="selectSource('${escapeHtml(src)}')">
          ${escapeHtml(src)}
        </button>
      `;
    });
    sourceFiltersContainer.innerHTML = sourceHtml;
  }

  function getSourceCategory(src) {
    if (!src) return 'Other';
    const s = src.toLowerCase();
    if (s.includes('openalex')) return 'OpenAlex';
    if (s.includes('pubmed')) return 'PubMed';
    if (s.includes('biorxiv') || s.includes('medrxiv')) return 'bioRxiv';
    return 'Other';
  }

  function selectTrack(trackKey) {
    appState.activeTrack = trackKey;
    renderFilterControls();
    renderPaperList();
  }

  function selectSource(source) {
    appState.activeSource = source;
    renderFilterControls();
    renderPaperList();
  }

  function handleSearchInput() {
    appState.searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
    renderPaperList();
  }

  function handleSortChange() {
    appState.sortOrder = document.getElementById('sort-select').value;
    renderPaperList();
  }

  /* Paper List Rendering */
  function renderPaperList() {
    const listContainer = document.getElementById('paper-list');
    let papers = [...appState.allPapers];

    // Filter Track
    if (appState.activeTrack !== 'all') {
      papers = papers.filter(p => p.trackKey === appState.activeTrack);
    }

    // Filter Source
    if (appState.activeSource !== 'all') {
      papers = papers.filter(p => (p.source || 'Other') === appState.activeSource);
    }

    // Search Filter
    if (appState.searchQuery) {
      const q = appState.searchQuery;
      papers = papers.filter(p => {
        const titleMatch = (p.title || '').toLowerCase().includes(q);
        const authorMatch = (p.authors || []).join(' ').toLowerCase().includes(q);
        const abstractMatch = (p.abstract || '').toLowerCase().includes(q);
        return titleMatch || authorMatch || abstractMatch;
      });
    }

    // Sort
    papers.sort((a, b) => {
      const dateA = new Date(a.publish_date || '1970-01-01').getTime();
      const dateB = new Date(b.publish_date || '1970-01-01').getTime();
      return appState.sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
    });

    if (papers.length === 0) {
      listContainer.innerHTML = `
        <div class="empty-state">
          <p>未找到符合条件的文献</p>
        </div>
      `;
      return;
    }

    let html = '';
    papers.forEach(paper => {
      const paperUrl = paper.url || (paper.doi ? `https://doi.org/${paper.doi}` : '#');
      const authorsFormatted = formatAuthors(paper.authors);
      const sourceCategory = getSourceCategory(paper.source);

      html += `
        <article class="paper-card" id="${escapeHtml(paper.id || '')}">
          <div class="paper-header">
            <span class="badge badge-track">${escapeHtml(paper.trackLabel)}</span>
            <span class="badge badge-source" data-source="${sourceCategory}">${escapeHtml(paper.source || 'Other')}</span>
            ${paper.is_new ? '<span class="badge badge-new">NEW</span>' : ''}
            <span class="paper-date">${escapeHtml(paper.publish_date || '')}</span>
          </div>

          <a class="paper-title" href="${escapeHtml(paperUrl)}" target="_blank" rel="noopener noreferrer">
            ${escapeHtml(paper.title || 'Untitled')}
          </a>

          <div class="paper-meta">
            <span class="meta-authors">${escapeHtml(authorsFormatted)}</span>
            ${paper.journal ? `<span class="meta-journal">• ${escapeHtml(paper.journal)}</span>` : ''}
          </div>

          ${paper.abstract ? `
            <div class="abstract-wrapper">
              <button class="btn-toggle-abstract" onclick="toggleAbstract('${escapeHtml(paper.id || '')}')">
                <span>展开摘要</span> ▼
              </button>
              <div class="abstract-body" id="abstract-${escapeHtml(paper.id || '')}">
                ${escapeHtml(paper.abstract)}
              </div>
            </div>
          ` : ''}
        </article>
      `;
    });

    listContainer.innerHTML = html;
  }

  function formatAuthors(authors) {
    if (!authors || authors.length === 0) return '未知作者';
    if (authors.length <= 3) {
      return authors.join(', ');
    }
    return `${authors.slice(0, 3).join(', ')} 等`;
  }

  function toggleAbstract(paperId) {
    const abstractElem = document.getElementById(`abstract-${paperId}`);
    if (!abstractElem) return;

    const btn = abstractElem.previousElementSibling;
    const isOpen = abstractElem.classList.contains('open');

    if (isOpen) {
      abstractElem.classList.remove('open');
      if (btn) btn.innerHTML = `<span>展开摘要</span> ▼`;
    } else {
      abstractElem.classList.add('open');
      if (btn) btn.innerHTML = `<span>收起摘要</span> ▲`;
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.addEventListener('DOMContentLoaded', initApp);
</script>
